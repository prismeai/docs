# Checks the docs with the Mintlify CLI on every merge request and on main,
# then deploys main to https://docs.prisme.ai through the Mintlify API.
# Setup (CI/CD variables, Mintlify webhook): see "Deploying from GitLab" in README.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - deploy

default:
  image: node:22-alpine
  interruptible: true

.mint:
  stage: check
  cache:
    key: mint-cli
    paths:
      - .npm/
  before_script:
    - npm install --global --cache .npm --prefer-offline --no-audit --no-fund mint@4
  # main does not pass these checks yet: switch to blocking once it does.
  allow_failure: true

validate:
  extends: .mint
  script:
    - mint validate

broken-links:
  extends: .mint
  script:
    - mint broken-links

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MINTLIFY_API_KEY && $MINTLIFY_PROJECT_ID
  interruptible: false
  resource_group: mintlify-production
  environment:
    name: production
    url: https://docs.prisme.ai
  script:
    - node .gitlab/ci/mintlify-deploy.mjs
