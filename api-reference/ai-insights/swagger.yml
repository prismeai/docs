          type: string
          description: Agent nodes.
        description:
          type: string
          description: Agent nodes.
        category:
          type: string
          description: Agent nodes.
        tools:
          type: array
          description: Agent nodes.
          items:
            type: string
        tools_count:
          type: integer
        tags:
          type: array
          items:
            type: string
        guardrails:
