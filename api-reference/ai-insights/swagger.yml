              type: integer
            limit:
              type: integer
    # ----------------------------------------------------------------
    # Insights
    # ----------------------------------------------------------------
    Insight:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        agent_id:
          type: string
        user_id:
          type: string
        summary:
          type: string
          nullable: true
        topics:
          type: array
          nullable: true
          items:
            type: object
            properties:
              topic:
                type: string
              confidence:
                type: number
        sentiment:
          type: object
          nullable: true
          properties:
            overall:
              type: string
              enum: [positive, neutral, negative]
            score:
              type: number
            progression:
              type: array
              items: {}
        resolved:
          type: boolean
          nullable: true
        key_moments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              turn:
                type: integer
              type:
                type: string
              description:
                type: string
        custom_evaluations:
          type: array
          nullable: true
          items:
            type: object
            properties:
              criterion_id:
                type: string
              value: {}
              reasoning:
                type: string
        evaluation_score:
          type: number
          nullable: true
          description: Weighted evaluation score (0 to 100).
        analyzed_at:
          type: string
          format: date-time
        analysis_model:
          type: string
          nullable: true
        analysis_version:
          type: string
          nullable: true
        cost_tracking:
          type: object
          nullable: true
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            model:
              type: string
            cost:
              type: number
    InsightList:
      type: object
      properties:
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        pagination:
          $ref: '#/components/schemas/Pagination'
    InsightStatusList:
      type: object
      properties:
        statuses:
          type: array
          items:
            type: object
            properties:
              conversation_id:
                type: string
              status:
                type: string
                enum: [none, pending, processing, analyzed, failed]
              analyzed_at:
                type: string
                format: date-time
                nullable: true
              score:
                type: number
                nullable: true
                description: Evaluation score (0 to 100) when analyzed.
              insight_id:
                type: string
                nullable: true
      example:
        statuses:
          - conversation_id: ctx-123
            status: analyzed
            analyzed_at: '2026-09-20T14:05:00.000Z'
            score: 82
            insight_id: ins-789
          - conversation_id: ctx-456
            status: none
    # ----------------------------------------------------------------
    # Conversations
    # ----------------------------------------------------------------
    ProxiedConversationList:
      type: object
      description: Agent Factory conversation list, returned unchanged.
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
    ProxiedConversationDetail:
      type: object
      description: Agent Factory conversation detail, returned unchanged.
      additionalProperties: true
      properties:
        conversation:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
    AnalyzeRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [batch, realtime]
          default: batch
          maxLength: 16
        conversation_ids:
          type: array
          description: Conversations to analyze.
          items:
            type: string
        model:
          type: string
          maxLength: 64
          description: Model used for the analysis.
        force:
          type: boolean
          description: Realtime mode only - re-analyze conversations that were already analyzed.
    AnalyzeResult:
      type: object
      properties:
        status:
          type: string
          enum: [queued, completed]
        mode:
          type: string
          enum: [batch, realtime]
        queue_id:
          type: string
          description: Batch mode only.
        message:
          type: string
          description: Batch mode only.
        analyzed_count:
          type: integer
          description: Realtime mode only - conversations analyzed successfully.
      example:
        status: queued
        queue_id: aq_corr-123
        mode: batch
        message: Analysis queued for processing
    # ----------------------------------------------------------------
    # Evaluation
    # ----------------------------------------------------------------
    EvaluationCriterion:
      type: object
      required: [id, type, question]
      properties:
        id:
          type: string
        type:
          type: string
          description: Answer type (`boolean`, `score` or `category` in the defaults).
          example: score
        question:
          type: string
        min:
          type: number
          description: Required for `score` criteria.
        max:
          type: number
        options:
          type: array
          description: Allowed values for `category` criteria.
          items:
            type: string
        weight:
          type: number
          description: Weight in the aggregated score.
    EvaluationCriteria:
      type: object
      properties:
        agent_id:
          type: string
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCriterion'
        is_custom:
          type: boolean
          description: '`false` when the default criteria apply.'
    UpdateCriteriaRequest:
      type: object
      required: [criteria]
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCriterion'
    UpdateCriteriaResult:
      type: object
      properties:
        success:
          type: boolean
        agent_id:
          type: string
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCriterion'
        message:
          type: string
          example: Evaluation criteria updated
    CriteriaValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        validation_errors:
          type: array
          items:
            type: string
          example: [Criterion clarity missing question]
