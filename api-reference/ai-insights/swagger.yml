          type: string
          maxLength: 128
        message_id:
          type: string
          maxLength: 128
        context_id:
          type: string
          maxLength: 128
          description: Conversation ID.
        agent_id:
          type: string
          maxLength: 64
        comment:
          type: string
          maxLength: 4096
    FeedbackResult:
      type: object
      properties:
        id:
          type: string
