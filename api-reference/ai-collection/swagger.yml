openapi: 3.0.3
info:
  version: 1.0.0
  title: Collections API
  description: |
    Public REST API for the Prisme.ai Collections workspace: named collections
    of structured records with typed schemas, MongoDB-style querying,
    aggregations, sharing and collection-scoped API keys.

    Collections live inside an organization (tenant boundary): a collection
    from another organization is always reported as not found. Within the
    organization, record access is granted to the collection owner and to the
    principals listed in its `agent_ids`. Every write emits an audit event.

    **MCP endpoints.** The same tools are exposed to AI agents and MCP clients
    over JSON-RPC 2.0 (`initialize`, `tools/list`, `tools/call`), not modeled as
    REST operations here:
    - `POST /ai-collection/mcp`: all tools (`data_discover`,
      `data_create_collection`, `data_insert`, `data_query`, `data_get`,
      `data_update`, `data_upsert`, `data_delete`, `data_count`,
      `data_distinct`, `data_aggregate`, `suggest_schema`). Tool arguments mirror
      the REST payloads below and take a `collection_id`.
    - `POST /v1/collections/{collectionId}/mcp`: scoped to a single collection.
      The `collection_id` is taken from the URL (agents never pass it) and
      `data_create_collection` / `suggest_schema` are not listed. This is the
      server URL Agent Factory configures when an agent is bound to a collection.
  contact:
    name: Prisme.ai
    url: https://prisme.ai
servers:
  - url: https://{host}/v2/workspaces/slug:ai-collection-v3/webhooks
    description: Prisme.ai workspace webhooks
    variables:
      host:
        default: api.studio.prisme.ai
        description: API host (override for self-hosted or sandbox)
security:
  - BearerAuth: []
  - OrgApiKeyAuth: []
tags:
  - name: Collections
    description: Create, list, read, update, and delete collections (metadata, schema and saved charts).
  - name: Records
    description: Insert, query, read, update, upsert, and delete records in a collection.
  - name: Analytics
    description: Count, distinct values, and aggregations (sum, avg, count with grouping).
  - name: Schema
    description: Evolve a collection after creation (add columns, apply indexes and unique constraints).
  - name: AI
    description: LLM-assisted helpers (schema suggestion, plain-language question answering).
  - name: Sharing
    description: Grant, list, update, and revoke access bindings on a collection (user, group, org).
  - name: API Keys
    description: Mint, list, rotate, and revoke org API keys scoped to a collection.
  - name: MCP
    description: JSON-RPC 2.0 endpoint exposing the collection tools to AI agents and MCP clients.
paths:
  /v1/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections
      description: |
        Returns the collections owned by the caller within their organization,
        paginated. Set `with_counts=true` to include an estimated `row_count`
        per collection (from database statistics, near-free, ideal for
        dashboards; the exact count is available via the count endpoint).
        Rate limit: 100 requests/min per user.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - name: with_counts
          in: query
          required: false
          description: Include an estimated `row_count` on each returned collection.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Collections owned by the caller (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
                  total:
                    type: integer
                    description: Total number of collections owned by the caller.
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: |
        Creates a named collection with a typed schema. At least one column is
        required in `properties` (use the suggest-schema endpoint to generate
        one from a description). Collection names are unique within the
        organization. The caller becomes the owner and gets an `owner` access
        binding.
        Rate limit: 100 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, properties]
              properties:
                name:
                  type: string
                  maxLength: 64
                  pattern: '^[a-zA-Z0-9 _-]+$'
                  description: Collection name (letters, digits, spaces, `-`, `_`; truncated to 64 characters). Unique within the organization.
                  example: products
                description:
                  type: string
                  description: Human-readable description, also visible to agents.
                  example: Product catalog, one row per SKU, prices in EUR
                settings:
                  $ref: '#/components/schemas/CollectionSettings'
                properties:
                  $ref: '#/components/schemas/SchemaProperties'
                indexes:
                  type: array
                  description: Indexes to create on the collection.
                  items:
                    $ref: '#/components/schemas/IndexDefinition'
                uniques:
                  type: array
                  description: 'Unique constraints. A unique on a column is required to use it as an upsert key in bulk import.'
                  items:
                    $ref: '#/components/schemas/IndexDefinition'
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  orgSlug:
                    type: string
                  owner_id:
                    type: string
                  owner_type:
                    type: string
                    enum: [user]
                  schema_applied:
                    type: boolean
                  status:
                    type: string
                    example: ready
        '400':
          description: 'Invalid arguments: missing or invalid name, no column in `properties`, or a collection with this name already exists in the organization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/collections/{collectionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Collections]
      operationId: getCollection
      summary: Get collection metadata
      description: |
        Returns the collection metadata, including its schema, indexes and
        saved charts. Only the owner and the principals in `agent_ids` may
        read it.
        Rate limit: 100 requests/min per user.
      responses:
        '200':
          description: Collection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: Update collection metadata
      description: |
        Updates the name, description, settings, or the `agent_ids` list. Only
        the provided fields are changed. To evolve the schema after creation,
        use the schema and indexes endpoints instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                settings:
                  $ref: '#/components/schemas/CollectionSettings'
                agent_ids:
                  type: array
                  description: Principals granted record access to this collection (replaces the list).
                  items:
                    type: string
                  example: [agent-abc, agent-def]
      responses:
        '200':
          description: Updated collection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection
      description: Permanently deletes the collection and **all its records**.
      responses:
        '200':
          description: Collection deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  collection_id:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/data:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Records]
      operationId: queryRecords
      summary: Query records
      description: |
        Returns records matching a MongoDB-style filter, with sorting,
        pagination, and field selection. Operators executing code or
        cross-referencing data (`$where`, `$function`, `$expr`, `$lookup`,
        `$merge`, `$accumulator`, `$out`) are rejected.

        Text equality is exact and case-sensitive: `{"category":"informatique"}`
        will not match a stored `Informatique`. For case-insensitive matching use
        a regex, e.g. `{"category":{"$regex":"^informatique$","$options":"i"}}`, or
        call the distinct endpoint first to get the exact stored value.
        Rate limit: 100 requests/min per user.
      parameters:
        - name: filter
          in: query
          required: false
          description: JSON-encoded MongoDB-style filter.
          schema:
            type: string
          example: '{"status":"active","deal_value":{"$gte":50000}}'
        - name: sort
          in: query
          required: false
          description: JSON-encoded sort specification.
          schema:
            type: string
          example: '{"createdAt":-1}'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - name: fields
          in: query
          required: false
          description: Comma-separated list of fields to return.
          schema:
            type: string
          example: name,email
      responses:
        '200':
          description: Matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of records in this page.
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Records]
      operationId: insertRecords
      summary: Insert records
      description: |
        Inserts one record or a batch of up to 1,000 records. Each record is
        stamped with the caller's `user_id` and, when a TTL applies, an
        `expires_at` timestamp.
        Rate limit: 20 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  description: A single record object or an array of up to 1,000 records.
                  oneOf:
                    - $ref: '#/components/schemas/RecordInput'
                    - type: array
                      maxItems: 1000
                      items:
                        $ref: '#/components/schemas/RecordInput'
                ttl_days:
                  type: integer
                  minimum: 0
                  description: Auto-expire the records after N days (0 = never).
      responses:
        '201':
          description: Records inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted_count:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/collections/{collectionId}/data/count:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Analytics]
      operationId: countRecords
      summary: Count records
      description: 'Exact count of the matching records. Rate limit: 100 requests/min per user.'
      parameters:
        - name: filter
          in: query
          required: false
          description: JSON-encoded MongoDB-style filter.
          schema:
            type: string
      responses:
        '200':
          description: Number of matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/{collectionId}/data/distinct:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Analytics]
      operationId: distinctValues
      summary: Get distinct values of a field
      description: 'Returns up to 1,000 unique values for a field. Rate limit: 100 requests/min per user.'
      parameters:
        - name: field
          in: query
          required: true
          schema:
            type: string
          example: category
        - name: filter
          in: query
          required: false
          description: JSON-encoded MongoDB-style filter.
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: Set to `true` to include the number of occurrences of each distinct value.
          schema:
            type: boolean
      responses:
        '200':
          description: Distinct values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    type: string
                  count:
                    type: integer
                    description: Number of distinct values returned.
                  values:
                    type: array
                    items: {}
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/{collectionId}/data/aggregate:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    post:
      tags: [Analytics]
      operationId: aggregateRecords
      summary: Run aggregations
      description: |
        Computes sums, averages, and counts over matching records, with
        optional grouping. Maximum 10 aggregation steps per call.
        Rate limit: 100 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                filter:
                  type: object
                  description: MongoDB-style filter applied before aggregating.
                group_by:
                  type: string
                  description: Field to group results by.
                  example: category
                steps:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [sum, avg, count]
                      input_field:
                        type: string
                        description: Numeric field to aggregate (optional for `count`).
                      output_field:
                        type: string
                        description: Name of the result field (defaults to the step `type`).
            example:
              filter: { status: completed }
              group_by: category
              steps:
                - { type: sum, input_field: amount, output_field: total }
                - { type: avg, input_field: amount, output_field: avg_amount }
      responses:
        '200':
          description: Aggregation results (one row per group).
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/{collectionId}/data/upsert:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    post:
      tags: [Records]
      operationId: upsertRecord
      summary: Upsert a record
      description: |
        Inserts the record, or updates the existing one matching the
        `match_fields` values (e.g. an email or a SKU).
        Rate limit: 50 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, match_fields]
              properties:
                data:
                  $ref: '#/components/schemas/RecordInput'
                match_fields:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Fields identifying the record to update if it exists.
                  example: [email]
      responses:
        '200':
          description: Upsert result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation:
                    type: string
                    example: upserted
                  result:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/{collectionId}/data/{recordId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Record identifier (`_id`).
    get:
      tags: [Records]
      operationId: getRecord
      summary: Get a record
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Records]
      operationId: updateRecord
      summary: Update a record
      description: |
        Updates the record's fields. System fields (`_id`, `created_at`,
        `createdAt`, ownership metadata) are protected and stripped from the
        payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
      responses:
        '200':
          description: Update result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                  matched_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Delete a record
      description: Deletes a single record.
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/{collectionId}/data/bulk:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    post:
      tags: [Records]
      operationId: bulkInsertRecords
      summary: Bulk-insert records (large imports)
      description: |
        Batch-inserts up to 5,000 records in a single call, built for large CSV
        imports (the client streams the file and posts batches). Records are
        stored as sent: unlike the insert endpoint, no per-record `user_id` or
        TTL is added. A batch is a single database flush and is all-or-nothing:
        if one record violates a column type or constraint the whole batch is
        rejected with `422` and no per-row error list, so validate and coerce
        types client-side before posting. Provide `upsert_key` (a column with a
        unique constraint) for an idempotent re-import that updates instead of
        duplicating.
        Rate limit: 120 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/RecordInput'
                upsert_key:
                  type: string
                  description: Unique column used as the conflict key (idempotent upsert).
                  example: sku
      responses:
        '201':
          description: Batch inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                  mode:
                    type: string
                    enum: [append, upsert]
                  collection_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    description: Raw engine result.
        '400':
          description: 'Validation error (`VALIDATION_ERROR` for an empty batch, `BATCH_TOO_LARGE` above 5,000 records).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Batch rejected (all-or-nothing) due to a type or constraint violation (`BATCH_INSERT_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/collections/{collectionId}/schema:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    patch:
      tags: [Schema]
      operationId: updateSchema
      summary: Add or merge columns
      description: |
        Adds or updates typed columns by merging the provided `properties` into
        the current schema. Existing indexes and unique constraints are
        preserved. New columns must be nullable (the table may already hold
        rows); changing an existing column's type is a data migration and may
        fail on existing data.
        Rate limit: 20 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [properties]
              properties:
                properties:
                  $ref: '#/components/schemas/SchemaProperties'
      responses:
        '200':
          description: Updated schema.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: boolean
                  collection_id:
                    type: string
                  schema:
                    $ref: '#/components/schemas/SchemaProperties'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/indexes:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    post:
      tags: [Schema]
      operationId: applyIndexes
      summary: Apply indexes and unique constraints
      description: |
        Applies indexes and unique constraints to an existing collection. Provide
        the full desired set; the constraints are persisted so a later schema
        change re-applies them. A unique constraint is required to use a column as
        an upsert key in bulk import. Returns `400 NO_SCHEMA` if the collection
        has no typed columns.
        Rate limit: 20 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                indexes:
                  type: array
                  items:
                    $ref: '#/components/schemas/IndexDefinition'
                uniques:
                  type: array
                  items:
                    $ref: '#/components/schemas/IndexDefinition'
      responses:
        '200':
          description: Indexes applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: boolean
                  collection_id:
                    type: string
                  indexes:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexDefinition'
                  uniques:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/charts:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Collections]
      operationId: getCharts
      summary: Get saved charts
      description: 'Returns the collection saved chart specs (shared at the collection level). Rate limit: 60 requests/min per user.'
      responses:
        '200':
          description: Saved charts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection_id:
                    type: string
                  charts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChartSpec'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Collections]
      operationId: saveCharts
      summary: Replace saved charts
      description: 'Replaces the full set of chart specs (max 50). Send the whole array.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charts]
              properties:
                charts:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ChartSpec'
      responses:
        '200':
          description: Charts saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                  collection_id:
                    type: string
                  charts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChartSpec'
        '400':
          description: Invalid body, or more than 50 charts (`TOO_MANY_CHARTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/ask:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    post:
      tags: [AI]
      operationId: askCollection
      summary: Ask a plain-language question
      description: |
        Answers a natural-language question about a collection. The org default
        LLM turns the question into a query or aggregation plan using only the
        schema, a few sample rows, and the row count (never the full dataset);
        the plan runs server-side; a short natural-language answer is generated
        from the bounded result. Returns `answer`, `plan`, and `data`.
        Rate limit: 20 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: How many products are in the Informatique category?
      responses:
        '200':
          description: Answer, the executed plan, and the bounded result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  plan:
                    type: object
                    description: The generated plan (`mode` is `query` or `aggregate`).
                    additionalProperties: true
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Missing question, no default completion model configured for the organization (`NO_DEFAULT_MODEL`), or the plan failed to execute (`EXECUTION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The model could not produce a usable plan for this question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: The LLM call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/suggest-schema:
    post:
      tags: [AI]
      operationId: suggestSchema
      summary: Suggest a schema from a description
      description: |
        Suggests a typed `properties` schema from a plain-language description of
        the data to store, using the org default LLM. Feed the result to the
        collection create endpoint.
        Rate limit: 20 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  example: A CRM of companies with name, industry, website and annual revenue in EUR
                name:
                  type: string
                  description: Optional collection name, echoed back.
                  example: companies
      responses:
        '200':
          description: Suggested schema.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  properties:
                    $ref: '#/components/schemas/SchemaProperties'
                  model:
                    type: string
                    description: Model used to generate the suggestion.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: The LLM call failed or returned an unusable schema (`SUGGEST_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/collections/{collectionId}/access:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [Sharing]
      operationId: listAccess
      summary: List access bindings
      description: |
        Lists who the collection is shared with (owner, users, groups, org).
        Requires the `share` permission on the collection.
        Rate limit: 100 requests/min per user.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Access bindings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessBinding'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sharing]
      operationId: grantAccess
      summary: Grant access
      description: |
        Grants a role to a principal within the same organization. The principal
        must be a member of the caller's org (users and groups are verified via
        governance). Cross-org principals are rejected, and the owner cannot be
        re-shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_type, principal_id, role]
              properties:
                principal_type:
                  type: string
                  enum: [user, group, org]
                principal_id:
                  type: string
                  maxLength: 256
                  description: 'For `user`: a member user id. For `group`: `orgSlug:group`. For `org`: the org slug.'
                  example: user-123
                role:
                  type: string
                  enum: [reader, editor, admin]
      responses:
        '201':
          description: Binding created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A binding already exists for this principal (`ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/collections/{collectionId}/access/{principalType}/{principalId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
      - name: principalType
        in: path
        required: true
        schema:
          type: string
          enum: [user, group, org]
      - name: principalId
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
    get:
      tags: [Sharing]
      operationId: getAccessBinding
      summary: Get an access binding
      responses:
        '200':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBinding'
        '404':
          description: Collection or binding not found (`BINDING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Sharing]
      operationId: updateAccessBinding
      summary: Change a binding role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [reader, editor, admin]
      responses:
        '200':
          description: Updated binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sharing]
      operationId: revokeAccess
      summary: Revoke access
      responses:
        '200':
          description: Binding revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '400':
          description: The binding could not be deleted (`DELETE_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/api-keys:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Lists the API keys scoped to this collection. Raw keys are never returned.
        Rate limit: 100 requests/min per user.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Page size.
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: API keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Mint an API key
      description: |
        Mints an org API key scoped to this collection. The raw key is returned
        exactly once, in the `secret` field: store it now, it cannot be retrieved
        again. When `permissions` is omitted, the workspace default permissions
        apply; at least one permission is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  maxLength: 128
                slug:
                  type: string
                  maxLength: 96
                  description: Unique identifier for the key within the org. Also used as the key `id`.
                permissions:
                  type: array
                  items:
                    type: string
                    maxLength: 96
                  example: [collections:read]
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional expiration date.
      responses:
        '201':
          description: 'API key created. `secret` is shown only once.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/api-keys/{keyId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
      - name: keyId
        in: path
        required: true
        description: API key identifier (its `id`, i.e. the slug given at creation).
        schema:
          type: string
    get:
      tags: [API Keys]
      operationId: getApiKey
      summary: Get an API key
      responses:
        '200':
          description: The API key metadata (no secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [API Keys]
      operationId: deleteApiKey
      summary: Revoke an API key
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/collections/{collectionId}/api-keys/{keyId}/rotate:
    parameters:
      - name: collectionId
        in: path
        required: true
        description: Collection identifier (`collection_id` returned at creation, `coll_id` on the collection object).
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9_-]+$'
      - name: keyId
        in: path
        required: true
        description: API key identifier (its `id`, i.e. the slug given at creation).
        schema:
          type: string
    post:
      tags: [API Keys]
      operationId: rotateApiKey
      summary: Rotate an API key
      description: 'Regenerates the key. The new raw key is returned once, in `secret`.'
      responses:
        '200':
          description: 'Key rotated. `secret` is shown only once.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '404':
          $ref: '#/components/responses/NotFound'
  /ai-collection/mcp:
    post:
      tags: [MCP]
      operationId: mcpEndpoint
      summary: MCP endpoint (JSON-RPC 2.0)
      description: |
        Model Context Protocol endpoint for AI agents and MCP clients.
        Implements `initialize`, `tools/list`, and `tools/call` over
        JSON-RPC 2.0.

        Available tools: `data_discover` (schema + sample rows, call first),
        `data_create_collection`, `data_insert`, `data_query`, `data_get`,
        `data_update`, `data_upsert`, `data_delete`, `data_count`,
        `data_distinct`, `data_aggregate`, `suggest_schema`.
        Tool arguments mirror the REST payloads documented above.

        A per-collection scoped endpoint is also available at
        `/v1/collections/{collectionId}/mcp`: it binds an agent to a single
        collection (no `collection_id` argument needed on each call).
        Rate limit: 100 requests/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ['2.0']
                id:
                  oneOf:
                    - type: string
                    - type: integer
                method:
                  type: string
                  enum: [initialize, tools/list, tools/call]
                params:
                  type: object
                  description: |
                    For `tools/call`: `{ "name": "<tool>", "arguments": { ... } }`.
                  additionalProperties: true
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/call
              params:
                name: data_query
                arguments:
                  collection_id: 3f2a9c1e-...
                  filter: { status: active }
                  limit: 20
      responses:
        '200':
          description: JSON-RPC 2.0 response (`result` on success, `error` on failure).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    enum: ['2.0']
                  id:
                    oneOf:
                      - type: string
                      - type: integer
                  result:
                    type: object
                    additionalProperties: true
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User session JWT. Send as `Authorization: Bearer <token>`.'
    OrgApiKeyAuth:
      type: apiKey
      in: header
      name: x-prismeai-api-key
      description: Organization-scoped API key.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size (max 100).
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based).
  responses:
    BadRequest:
      description: Invalid arguments (bad filter operator, batch too large, missing field...), or the collection does not exist or is not accessible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is neither the owner of the collection nor listed in its `agent_ids`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Collection (or sub-resource) not found, or it belongs to another organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMITED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Collection:
      type: object
      properties:
        _id:
          type: string
          description: Internal storage id.
        coll_id:
          type: string
          format: uuid
          description: Collection identifier, used in every `/v1/collections/{collectionId}` path.
        name:
          type: string
          example: products
        description:
          type: string
        orgSlug:
          type: string
          description: Organization the collection belongs to (tenant boundary).
        owner_id:
          type: string
          description: User ID owning the collection.
        owner_type:
          type: string
          enum: [user]
        agent_ids:
          type: array
          description: Principals granted record access in addition to the owner.
          items:
            type: string
        settings:
          $ref: '#/components/schemas/CollectionSettings'
        schema:
          $ref: '#/components/schemas/SchemaProperties'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/IndexDefinition'
        uniques:
          type: array
          items:
            $ref: '#/components/schemas/IndexDefinition'
        charts:
          type: array
          items:
            $ref: '#/components/schemas/ChartSpec'
        row_count:
          type: integer
          nullable: true
          description: 'Only on list with `with_counts=true`: an estimated count (null when the table does not exist yet).'
        status:
          type: string
          example: ready
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CollectionSettings:
      type: object
      description: Free-form settings stored with the collection.
      properties:
        ttl_days:
          type: integer
          minimum: 0
          description: Record expiration in days (0 = never).
        max_records:
          type: integer
          description: Collection size limit.
      additionalProperties: true
    SchemaProperties:
      type: object
      description: 'Column definitions: field name -> type descriptor.'
      additionalProperties:
        type: object
        required: [type]
        properties:
          type:
            type: string
            description: 'Column type: `text`, `integer`, `double`, `boolean`, `date`, `datetime`, `json` or `array` (`float`, `decimal` and `number` are also accepted).'
            example: text
          nullable:
            type: boolean
      example:
        product_name: { type: text }
        price: { type: double }
        stock: { type: integer, nullable: true }
        active: { type: boolean }
        released_at: { type: date }
        specs: { type: json }
    RecordInput:
      type: object
      description: |
        Record fields matching the collection schema. System fields are
        ignored on update.
      additionalProperties: true
      example:
        product_name: Laptop Pro 16
        price: 2199.9
        stock: 42
        active: true
    Record:
      type: object
      description: A stored record, including system fields.
      properties:
        _id:
          type: string
        user_id:
          type: string
          description: User who inserted the record (not set by bulk import).
        expires_at:
          type: integer
          description: Expiration timestamp in milliseconds, when a TTL applies.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    IndexDefinition:
      type: object
      description: An index or unique constraint over one or more columns.
      required: [properties]
      properties:
        properties:
          type: array
          items:
            type: string
          example: [sku]
    ChartSpec:
      type: object
      description: |
        A saved chart specification, stored and returned verbatim (opaque to the
        API). The fields below are the ones used by the Prisme.ai Collections
        app; charts are computed with the aggregate endpoint.
      properties:
        id:
          type: string
        kind:
          type: string
          example: bar
          description: 'e.g. kpi, bar, line.'
        title:
          type: string
        agg:
          type: string
          example: count
        field:
          type: string
        dimension:
          type: string
      additionalProperties: true
    AccessBinding:
      type: object
      properties:
        object:
          type: string
          example: collection.access_binding
        collection_id:
          type: string
        principal_type:
          type: string
          enum: [user, group, org]
        principal_id:
          type: string
        role:
          type: string
          enum: [owner, reader, editor, admin]
        email:
          type: string
          nullable: true
        org_slug:
          type: string
          nullable: true
        granted_by:
          type: string
          nullable: true
        created_at:
          type: integer
          nullable: true
          description: Unix seconds.
        updated_at:
          type: integer
          nullable: true
          description: Unix seconds.
    ApiKey:
      type: object
      description: API key metadata. The raw key is never included here.
      properties:
        id:
          type: string
          description: Key identifier (the slug).
        object:
          type: string
          example: collection.api_key
        collection_id:
          type: string
        slug:
          type: string
        name:
          type: string
        scope:
          type: string
          example: ai-collection-v3:collections:3f2a9c1e-...
        permissions:
          type: array
          items:
            type: string
        expires_at:
          type: integer
          nullable: true
          description: Unix seconds.
        created_at:
          type: integer
          nullable: true
          description: Unix seconds.
        updated_at:
          type: integer
          nullable: true
          description: Unix seconds.
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            secret:
              type: string
              description: 'The raw API key (`iak_...`). Returned only once, on create and rotate.'
    Error:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
