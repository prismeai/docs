openapi: '3.0.3'
info:
  version: 1.0.0
  title: LLM Gateway API
  description: |
    Public REST API for the Prisme.ai LLM Gateway - OpenAI-compatible
    chat completions, embeddings and image generation/editing, a standard
    rerank endpoint, a managed model catalogue with governance overrides
    per organization, and quota status for users and organizations.

    The gateway abstracts multi-provider LLM access (OpenAI, Azure OpenAI,
    Anthropic, Google Vertex, AWS Bedrock, OpenAI-compatible providers) behind
    an OpenAI-compatible request/response shape. It enforces per-tenant
    governance (allowed models, default models, quotas) and emits analytics
    events (`analytics.llm.completion`) usable for cost and carbon reporting.

    This spec documents only the public REST surface (endpoints exposed via
    Prisme.ai workspace webhooks). Internal helpers (private automations
    prefixed with `_`) and load-test mocks are not part of the public contract.
  contact:
    name: Prisme.ai
    url: https://prisme.ai
servers:
  - url: https://{host}/v2/workspaces/slug:llm-gateway/webhooks
    description: Prisme.ai workspace webhooks
    variables:
      host:
        default: api.studio.prisme.ai
        description: API host (override for self-hosted or sandbox)
security:
  - BearerAuth: []
  - OrgApiKeyAuth: []
tags:
  - name: Completions
    description: OpenAI-compatible chat completions (with optional SSE streaming).
  - name: Embeddings
    description: OpenAI-compatible text embeddings.
  - name: Rerank
    description: Rerank documents by relevance to a query (standard rerank contract, LLM-as-reranker backend).
  - name: Images
    description: OpenAI-compatible image generation and image editing.
  - name: Models
    description: Model catalogue (CRUD + bulk replace + governance-aware listing).
  - name: Audio
    description: OpenAI-compatible speech-to-text (audio transcriptions).
  - name: Quotas
    description: Effective LLM quota limits and current usage, per user and per organization.
  - name: Defaults
    description: Resolved default models for completions / embeddings / image generation / transcription / file parsing.
  - name: Test
    description: Smoke-test reachability of a model through the gateway.
paths:
  /v1/chat/completions:
    post:
      tags: [Completions]
      operationId: createChatCompletion
      summary: Create a chat completion
      description: |
        OpenAI-compatible chat completions. Routes the request through the
        gateway's provider layer (OpenAI, Azure OpenAI, Anthropic, Vertex,
        Bedrock, OpenAI-compatible) based on the resolved model spec.

        **Streaming.** When `stream: true`, the response is a `text/event-stream`
        of OpenAI-compatible delta chunks (`ChatCompletionChunk`) followed by a
        literal `data: [DONE]` payload, then one final `chat.completion` frame
        (same shape as `ChatCompletionResponse`) carrying the assembled message,
        `finish_reason` and `usage`. Provider-native stream shapes
        (Anthropic, Bedrock, Vertex) are normalised to OpenAI deltas before
        being forwarded. Provider errors mid-stream are emitted as a synthetic
        chunk carrying an `error` object and a `content` fallback message,
        followed by `[DONE]`.

        **Failover.** When the requested model was attempted and failed, and a
        fallback answered instead (governance failover mapping merged with
        `fallback_models`), the switch is reported as
        `failover: { from_model, to_model }` on the response body, or on the
        first forwarded chunk when streaming.

        **Thinking blocks.** Anthropic thinking blocks are never streamed. They
        are returned on the assistant message as `reasoning_details`, tagged
        with `reasoning_model` (the model that answered). Send both back
        verbatim when replaying the turn: the gateway forwards the blocks only
        to that same model, drops them for any other, and never sends the
        `reasoning_model` tag to a provider.

        When `stream: false` (default), the response is a single JSON
        `ChatCompletionResponse`. The non-streaming response is enriched with
        `usage.cost`, `usage.duration_ms`, and `usage.carbon` (Prisme.ai
        extensions over the standard OpenAI shape).

        **Prisme.ai extensions** in the request body:
        - `task_id` - opaque correlation identifier for A2A flows.
        - `analytics_context` - caller-supplied context (`orgSlug`, `agent_id`,
          `user_id`, `context_id`, `agent_allowed_models`, `call_type`,
          `message_turn`) used to enrich `analytics.llm.completion` events.
        - `fallback_models` - ordered models tried when the requested model
          fails, merged with the governance failover mapping; each one is
          checked against the caller's access like the primary.

        **Rate limiting.** 100 requests per 60 seconds per consumer
        (`auth.user_id` or `session.id`).

        **Governance.** Calls may be rejected with `403 MODEL_NOT_ALLOWED` or
        `429` quota errors based on the caller's organization governance
        (resolved via `ai-governance-v2`), or with `403 HEADER_POLICY_VIOLATION`
        when a required upstream identity header would reach the model provider
        empty (see `header_policy`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            Successful completion. Content type depends on `request.stream`:
            - `application/json`: non-streaming `ChatCompletionResponse`.
            - `text/event-stream`: SSE stream of `ChatCompletionChunk` payloads
              followed by `data: [DONE]` and a final `chat.completion` frame.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                description: |
                  Server-Sent Events stream. Each `data:` line carries a JSON
                  `ChatCompletionChunk` (delta), then a literal `[DONE]` line,
                  then one final `chat.completion` frame shaped like
                  `ChatCompletionResponse`. The schema below describes the
                  per-chunk JSON payload.
                allOf:
                  - $ref: '#/components/schemas/ChatCompletionChunk'
        '400':
          description: Validation error (validateArguments rejected the body shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Refused by a governance overlay. The machine-readable code is
            typically `MODEL_NOT_ALLOWED`, or `HEADER_POLICY_VIOLATION` when a
            required upstream identity header would reach the provider empty
            (`details.missing` then lists the header names).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit exceeded (`code: RATE_LIMITED`, 100 req / 60 s per
            consumer) or governance quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/embeddings:
    post:
      tags: [Embeddings]
      operationId: createEmbedding
      summary: Create text embeddings
      description: |
        OpenAI-compatible embeddings endpoint. Accepts a single string or an
        array of strings as `input` and routes through the gateway's provider
        layer. Returns the standard OpenAI `EmbeddingResponse`. When the input
        is a single string, the response also exposes a flat `embedding` field
        (Prisme.ai convenience extension) in addition to `data[0].embedding`.

        `analytics_context` is a Prisme.ai extension used to enrich analytics
        events.

        Governance overlays may reject the call (forwarded as 403 / 429 with
        the upstream `result.status`, e.g. `MODEL_NOT_ALLOWED`,
        `HEADER_POLICY_VIOLATION`, `INVALID_DIMENSIONS`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Successful embedding response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: |
            Invalid request. Includes governance/provider rejections forwarded
            from the inner worker (e.g. `INVALID_DIMENSIONS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Refused by a governance overlay: `MODEL_NOT_ALLOWED`, or
            `HEADER_POLICY_VIOLATION` when a required upstream identity header
            would reach the provider empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Governance quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/rerank:
    post:
      tags: [Rerank]
      operationId: createRerank
      summary: Rerank documents by relevance
      description: |
        Reranks a set of candidate documents by their relevance to a query,
        following the de-facto standard rerank contract (compatible with
        Cohere v2 / Jina / Voyage): a request of `{ model, query, documents }`
        returns `{ results: [{ index, relevance_score }] }` sorted by
        `relevance_score` descending, where `index` is the position of the
        document in the input `documents` array.

        **Backend.** LLM-as-reranker: relevance is scored via chat completions
        (deterministic, `temperature: 0`, JSON output), then sorted server-side
        so the ordering never relies on the model's own output order. The
        request/response contract deliberately matches native rerankers, so the
        backend can later be swapped to a native cross-encoder without changing
        callers. Use `model: "mock"` for a deterministic, LLM-free response in
        CI / load tests.

        **Limits.** All documents are scored in a single prompt (no batching);
        `documents` is capped at 200 items and `max_tokens_per_doc` is advisory.
        Suited to a post-retrieval rerank window rather than large corpora.

        **Rate limiting.** 100 requests per 60 seconds per consumer
        (`auth.user_id` or `session.id`).

        **Governance.** Reuses the `chat-completions` permission and the
        organization governance overlay, so calls may be rejected with
        `403 MODEL_NOT_ALLOWED` or `429` quota errors, or with a `403` whose
        `code` is `HEADER_POLICY_VIOLATION` when a required upstream identity
        header would reach the provider empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Successful rerank response (results sorted by relevance_score descending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          description: |
            Validation error: missing `query`, empty `documents`, or more than
            200 documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Refused by a governance overlay. The machine-readable code is
            typically `MODEL_NOT_ALLOWED`. A header-policy refusal is wrapped
            like any other inner completion failure: `error` is `RERANK_FAILED`
            and the original `HEADER_POLICY_VIOLATION` is carried in `code`,
            without the `details.missing` list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit exceeded (`code: RATE_LIMITED`, 100 req / 60 s per
            consumer) or governance quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            The reranker backend failed or returned no parseable results
            (`code: RERANK_FAILED` or `RERANK_PARSE_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/images/generations:
    post:
      tags: [Images]
      operationId: createImage
      summary: Generate images
      description: |
        OpenAI-compatible image generation. The gateway resolves the model
        (request `model`, else the org governance default, else the platform
        default `config.defaults.image_generation`) and routes the call to the
        provider (OpenAI, Azure OpenAI, Google Vertex Imagen).

        **Size resolution.** Pass an abstract `aspect` + `tier`, or an explicit
        pixel `size`. The gateway snaps it to a size listed in the model's
        `capabilities.supported_sizes`; an exact supported `size` is kept as is.
        Without a supported-sizes list, `size` is passed through (default
        `1024x1024`). The size actually used is returned in `size`.

        **Images are always returned as URLs.** When the provider only returns
        base64 data, the gateway uploads it to Prisme.ai file storage and
        returns a tokenised `url` instead, so `data[].b64_json` is never
        present in the response.

        **Governance.** Requires the `image-generation` model permission. A
        model not allowed for the organization is either downgraded to the
        governance fallback model (`soft_downgrade` quota policy) or refused
        with `403 MODEL_NOT_ALLOWED`. A required upstream identity header that
        would reach the provider empty is refused with
        `403 HEADER_POLICY_VIOLATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: Generated images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesResponse'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Missing `image-generation` permission (`FORBIDDEN`), model refused by
            the organization governance (`MODEL_NOT_ALLOWED`), or header-policy
            refusal (`HEADER_POLICY_VIOLATION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: |
            Provider error, forwarded with the provider's HTTP status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/images/edits:
    post:
      tags: [Images]
      operationId: editImage
      summary: Edit an image
      description: |
        Edits an existing image from a prompt. Same model resolution,
        governance and size resolution as `POST /v1/images/generations`
        (the `image-generation` model permission applies).

        The source image is passed as `image_url`, a URL the gateway can fetch
        (for example a short-lived tokenised Prisme.ai file URL). The gateway
        downloads it and sends it to the provider (multipart `images/edits`
        for OpenAI / Azure `gpt-image` models, reference image for Vertex
        Imagen). As for generation, results are always returned as URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageEditRequest'
      responses:
        '200':
          description: Edited images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesResponse'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Missing `image-generation` permission (`FORBIDDEN`), model refused by
            the organization governance (`MODEL_NOT_ALLOWED`), or header-policy
            refusal (`HEADER_POLICY_VIOLATION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: |
            Provider error, forwarded with the provider's HTTP status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/audio/transcriptions:
    post:
      tags: [Audio]
      operationId: createTranscription
      summary: Transcribe audio into text
      description: |
        OpenAI-compatible speech-to-text endpoint: an OpenAI SDK pointed at
        this gateway calls it unchanged. The audio is sent as a multipart
        `file` part, held in memory only and never stored.

        `model` defaults to the organization's transcription model, then to
        the platform default. `srt` and `vtt` response formats are not
        supported; `text` is answered as `text/plain`, ended by a newline like
        OpenAI (a silent recording is `"\n"`). A file sent with a generic MIME
        type (`application/octet-stream`) is named after its original extension.

        Requires the `llm-gateway:models:audio-transcriptions` permission.
        Governance overlays may reject the model (403 `MODEL_NOT_ALLOWED`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (webm, mp4, m4a, mp3, ogg, wav, flac), 25 MB max by default.
                model:
                  type: string
                  maxLength: 256
                language:
                  type: string
                  description: ISO-639-1 language of the audio (e.g. `fr`). Detected when omitted.
                prompt:
                  type: string
                  description: Text to guide the transcription (vocabulary, previous segment).
                temperature:
                  type: number
                response_format:
                  type: string
                  enum: [json, text, verbose_json]
                  default: json
      responses:
        '200':
          description: Transcribed text.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
                  usage:
                    type: object
                    description: Provider usage, when reported.
            text/plain:
              schema:
                type: string
        '400':
          description: |
            Invalid request: missing file (`FILE_REQUIRED`), unsupported
            `response_format`, no transcription model configured
            (`NO_TRANSCRIPTION_MODEL`) or model declared on no provider
            (`UnknownModel`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission, or model not allowed for this caller (governance overlay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Audio file larger than the configured limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The transcription provider returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/defaults:
    get:
      tags: [Defaults]
      operationId: getDefaults
      summary: Get resolved default models
      description: |
        Returns the resolved default models for the calling org, merging
        platform defaults (`config.defaults.*`) with the org's governance
        overrides. The embedding default is enriched with `dimensions` and
        `supported_dimensions` looked up from the model catalogue.
      responses:
        '200':
          description: Resolved defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (only `GET` is accepted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List models from the catalogue
      description: |
        Returns a paginated, filterable list of models from the gateway
        catalogue.

        **Note.** The response uses Prisme.ai's standard pagination envelope
        (`{ items, total, page, limit }`), **not** OpenAI's
        `{ object: "list", data: [...] }` shape - this endpoint is the
        management catalogue, not the OpenAI-compatible model listing.

        Per-org availability filter:
        - No `orgSlug` query → restrict to models reachable from the current
          session (no `org_slugs` constraint, or the session's org is listed).
        - `orgSlug=all` (admin only) → returns the full catalogue regardless of
          per-model `org_slugs`.
        - `orgSlug=<slug>` (admin only) → impersonate that org's view.
      parameters:
        - in: query
          name: limit
          schema: { type: string }
          description: Page size (capped server-side at 100, default 100).
        - in: query
          name: page
          schema: { type: string }
          description: Zero-based page index.
        - in: query
          name: type
          schema:
            type: string
            enum: [completion, embeddings, image_generation, transcription]
          description: Filter by model type.
        - in: query
          name: enabled
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by enabled flag.
        - in: query
          name: model_ids
          schema: { type: string }
          description: Comma-separated list of model IDs.
        - in: query
          name: tags
          schema: { type: string }
          description: Comma-separated list of tags (matches any).
        - in: query
          name: visible_only
          schema:
            type: string
            enum: ["true", "false"]
          description: When `"true"`, exclude models with `display.hidden = true`.
        - in: query
          name: brand
          schema: { type: string }
          description: Exact match on `display.brand`.
        - in: query
          name: search
          schema: { type: string }
          description: Case-insensitive search across `model_id`, `display.name`, `display.brand`.
        - in: query
          name: capability
          schema:
            type: string
            enum: [vision, audio, text, image]
          description: Filter to models declaring the given capability.
        - in: query
          name: orgSlug
          schema: { type: string }
          description: |
            Admin-only override for the per-org availability filter. Use `all`
            to bypass the filter, or a slug to impersonate that org's view.
            Ignored for non-admin callers.
      responses:
        '200':
          description: Paginated list of models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsListResponse'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Models]
      operationId: createModel
      summary: Create a model in the catalogue
      description: |
        Inserts a new model entry. `model_id` and `type` are required. Returns
        409 if a model with the same `model_id` already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateInput'
      responses:
        '200':
          description: Model created. Returns the inserted document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: |
            Validation error. Codes: `MISSING_MODEL_ID`, `MISSING_TYPE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'A model with the same `model_id` already exists (`code: MODEL_EXISTS`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Models]
      operationId: replaceModels
      summary: Bulk-replace the entire model catalogue
      description: |
        Reconciles the models collection to the provided list. Used by the
        platform Models page "Import" flow.

        **Non-destructive reconcile.** Every incoming model is upserted
        (keyed on `model_id`) in a single bulk write, then the models absent
        from the list are pruned. The catalogue is never emptied mid-flight:
        a failure returns `500 BULK_REPLACE_FAILED` and leaves the previous
        catalogue in place (plus any rows already upserted).

        - Body must be `{ "models": [...] }` (max 500 items). Each item must
          carry at least `model_id` and `type`.
        - An empty list clears the whole catalogue, and is refused with
          `400 CONFIRMATION_REQUIRED` unless `confirm_clear_all: true` is sent.
        - Cache (`global.models_cache`) is fully invalidated.
        - Emits a `model.bulk_replaced` audit event.
        - Rate-limited: 2 calls per 60 seconds per consumer
          (`ModelsBulkReplace`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  description: Replacement catalogue (max 500 items).
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/ModelCreateInput'
                confirm_clear_all:
                  type: boolean
                  description: |
                    Required (`true`) when `models` is empty, to confirm wiping
                    the entire catalogue. Ignored otherwise.
      responses:
        '200':
          description: Bulk replace summary.
          content:
            application/json:
              schema:
                type: object
                required: [upserted, pruned, inserted, deleted]
                properties:
                  upserted:
                    type: integer
                    description: Number of models inserted or updated (the full incoming list).
                  pruned:
                    type: integer
                    description: Number of stale models removed (absent from the new list).
                  inserted:
                    type: integer
                    description: Backward-compatible alias for `upserted`.
                  deleted:
                    type: integer
                    description: Backward-compatible alias for `pruned`.
        '400':
          description: |
            Validation error. Codes: `INVALID_BODY` (missing or non-array
            `models`), `INVALID_ITEMS` (one or more items missing `model_id` or
            `type` - `details` lists the offending entries),
            `PAYLOAD_TOO_LARGE` (more than 500 items). An empty `models` list
            without `confirm_clear_all: true` is refused with
            `error: CONFIRMATION_REQUIRED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (`code: RATE_LIMITED`, 2 req / 60 s per consumer).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The reconcile failed (`code: BULK_REPLACE_FAILED`). Nothing is
            pruned (no partial wipe); `details` carries the underlying error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models/catalog:
    get:
      tags: [Models]
      operationId: getModelCatalog
      summary: Read the Prisme.ai reference model catalogue
      description: |
        Static reference catalogue shipped with the gateway: per known model, its
        `key`, `aliases`, recommended metrics (`suggested`), indicative
        `reference_pricing` and factual `spec` (type, capabilities, context,
        `max_response_tokens`, `end_of_life`, request handling). Read-only; never
        changes the environment.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  methodology_version:
                    type: string
                  source:
                    type: string
                  verified_at:
                    type: string
                  models:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        key:
                          type: string
                        display_name:
                          type: string
                        brand:
                          type: string
                        aliases:
                          type: array
                          items:
                            type: string
                        suggested:
                          type: object
                          additionalProperties: true
                        reference_pricing:
                          type: object
                          additionalProperties: true
                        spec:
                          type: object
                          additionalProperties: true
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models/catalog/sync:
    post:
      tags: [Models]
      operationId: syncModelCatalog
      summary: Align the environment's models with the catalogue
      description: |
        Back-fills `catalog_id` by name once, then applies the catalogue to the
        linked models: recommended metrics, `end_of_life`, the forced
        tool_choice refusal, `exclude_params` / `rename_params` (filled only when
        empty, else reported as `divergent`), `limits.max_response_tokens`. On
        every model (field `region`), clears a stored carbon region that changes
        nothing to the footprint — equal to what the provider entry gives (or the
        default when it gives none), or unknown — so it follows the provider
        again; a region that differs is an override and is kept.
        `limits.response_tokens` is never synced.
        Dry-run by default. Requires write access to models.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: true
                model_ids:
                  type: array
                  items:
                    type: string
                fields:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: What was (or would be) changed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  dry_run:
                    type: boolean
                  fields:
                    type: array
                    items:
                      type: string
                  summary:
                    type: object
                    additionalProperties: true
                  backfilled:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  patched:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unmatched:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  divergent:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  warnings:
                    type: array
                    description: 'Reported, never changed: `{model_id, code, provider, message}`. `OUTPUT_LIMIT_DROPPED` = a completion model whose provider entry excludes `max_tokens` with nothing renaming it, so its calls go out without an output limit.'
                    items:
                      type: object
                      additionalProperties: true
                  failed:
                    type: array
                    description: 'Models whose write failed (`dry_run: false`), as `{model_id, catalog_id, fields, error}`; each also emits an `error` event `ModelCatalogSyncWriteFailed`.'
                    items:
                      type: object
                      additionalProperties: true
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Write access to models required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models/unregistered:
    get:
      tags: [Models]
      operationId: listUnregisteredModels
      summary: List provider ids declared but not registered
      description: |
        Model ids declared in the gateway's provider configuration with no row in
        the models collection yet, with their provider and suggested carbon
        `region`. Ids only, never credentials. Requires write access to models.
      responses:
        '200':
          description: Declared, unregistered ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        model_id:
                          type: string
                        provider:
                          type: string
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Write access to models required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models/regions:
    get:
      tags: [Models]
      operationId: getModelRegions
      summary: List carbon-footprint regions
      description: |
        Regions a model can declare in `region` (each with its grid emission
        factor, kg CO2eq/kWh), plus the region suggested for `model_id` from
        the provider configuration: the provider's `carbon_region`, else the
        Bedrock AWS region mapped to its carbon region. `suggested` and
        `source` are null without `model_id` or when nothing can be inferred.
      parameters:
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Model id to suggest a region for.
      responses:
        '200':
          description: Regions and suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegions'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/models/{modelId}:
    parameters:
      - in: path
        name: modelId
        required: true
        schema:
          type: string
        description: |
          Identifier of the model document. Model IDs may contain forward
          slashes (e.g. `bedrock/anthropic.claude-3-haiku`,
          `eu.anthropic.claude-sonnet-4-20250514-v1:0`); the workspace router
          declares this parameter as a catch-all so consumers SHOULD send the
          slashes unencoded in the path.
    get:
      tags: [Models]
      operationId: getModel
      summary: Get a model by ID
      responses:
        '200':
          description: Model document, plus `excluded_params`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Model'
                  - type: object
                    properties:
                      excluded_params:
                        type: array
                        items:
                          type: string
                        description: Request parameters dropped before the call — the serving provider entry's `options.excludeParameters` plus the model's `provider_config.exclude_params`.
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Model not found (`code: MODEL_NOT_FOUND`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Models]
      operationId: updateModel
      summary: Update a model
      description: |
        Partial update - only fields present in the request body are applied.
        Updatable fields: `type`, `display`, `capabilities`, `limits`,
        `failover`, `region`, `dimensions`, `supported_dimensions`, `metrics`,
        `provider_config`, `tags`, `enabled`, `pricing`, `org_slugs`, `end_of_life`.
        An object field (`limits`, `display`, `capabilities`, `provider_config`,
        …) REPLACES the stored object: send it whole (read it first with GET),
        or keys you leave out — e.g. `limits.max_response_tokens` — are removed.
        Emits a `model.updated` audit event and invalidates the per-key cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateInput'
      responses:
        '200':
          description: Updated model document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Model not found (`code: MODEL_NOT_FOUND`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Models]
      operationId: deleteModel
      summary: Delete a model
      description: |
        Removes the model from the catalogue. Emits a `model.deleted` audit
        event and invalidates the per-key cache.
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, model_id]
                properties:
                  deleted:
                    type: boolean
                    description: Always `true` on success.
                  model_id:
                    type: string
                    description: Identifier of the deleted model.
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Model not found (`code: MODEL_NOT_FOUND`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/providers/{type}/{index}/models:
    get:
      tags: [Models]
      operationId: listProviderModels
      summary: List the models available at one provider entry
      description: |
        Calls the provider's own model listing for ONE entry of the saved
        gateway configuration (OpenAI and OpenAI-compatible `/models`, Azure
        OpenAI deployments, Anthropic `/v1/models`, Vertex Model Garden
        publisher models, Bedrock foundation models and inference profiles).
        Credentials stay server-side. Each model keeps the provider's own
        fields as-is, plus a standardized `id` (the value to declare in the
        entry), `declared` and `registered`. Requires write access to models.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [openai, azure_openai, openailike, anthropic, vertex, bedrock]
          description: Provider type, a key of the gateway `providers` configuration.
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Position of the entry in `providers.<type>` (`providers.azure_openai.resources` for Azure); 0 for the single-object providers.
      responses:
        '200':
          description: Models available at the provider entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModels'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Write access to models required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such entry in the saved configuration (`PROVIDER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The provider refused or failed the listing (credentials, permissions, unsupported endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/test:
    post:
      tags: [Test]
      operationId: runModelTest
      summary: Smoke-test a model through the gateway
      description: |
        Calls the gateway with a minimal request to verify a model is
        reachable. Used by the platform Models admin page (Test button).

        - `type: "embeddings"` → calls `OpenAI.embeddings` with `input: "Salut"`
          and returns `{ ok, dimensions, response }`.
        - `type: "completions"` (default) → calls `OpenAI.chat-completion` with
          a single-turn user message and a `get_weather` tool definition,
          returns `{ ok, response }`.

        On error, the call is wrapped in a `try`/`catch` and returns
        `{ ok: false, response: <error> }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRequest'
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
        '400':
          description: 'Missing `modelId` (`code: INVALID_BODY`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (only `POST` accepted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/test/capabilities:
    post:
      tags: [Test]
      operationId: probeModelCapabilities
      summary: Probe which optional request features a model accepts
      description: |
        Real calls through the saved model entry to probe optional features
        (e.g. `supports_forced_tool_choice`), in parallel. `supported: null`
        means inconclusive (rate limit, timeout…). Requires write access to
        models; each probe costs real tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
                  maxLength: 256
                options:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    maxLength: 64
                    pattern: ^[a-z0-9_]+$
      responses:
        '200':
          description: Probe results per option.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
                      properties:
                        supported:
                          type: boolean
                          nullable: true
                        reason:
                          type: string
                        message:
                          type: string
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Write access to models required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/quotas/me:
    get:
      tags: [Quotas]
      operationId: getMyQuotas
      summary: Get the caller's effective quotas
      description: |
        Effective LLM quota status for the calling user in their active
        organization: the per-user rate limits (`llm.rpm`, `llm.tpm`) and the
        organization monthly budgets (`llm.monthly_tokens`, `llm.monthly_cost`)
        with current usage. Only limits that are actually configured are
        returned as gauges.

        The per-user limit is the most specific one configured: user override,
        then per-role limit, then the plan's per-user default.

        Usage figures are snapshots: rate gauges are refreshed on each LLM
        request (`as_of` = time of the last request, and a sliding window means
        the live value can only be lower), monthly usage is aggregated hourly.

        **Requires a user session**: calls without a user identity (for
        example an org API key) get `401 UNAUTHORIZED`. When the caller has no
        active organization, the response carries an empty `gauges` list.

        **Rate limiting.** 60 requests per 60 seconds per user.
      responses:
        '200':
          description: Quota status for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyQuotasResponse'
        '401':
          description: Missing authentication or no user session (`UNAUTHORIZED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (`error: RATE_LIMITED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/quotas/usage:
    get:
      tags: [Quotas]
      operationId: getOrgQuotasUsage
      summary: Get the organization's quota usage
      description: |
        Organization-level quota status: the enforced LLM limits of the plan
        (`llm.rpm`, `llm.tpm`, `llm.monthly_tokens`, `llm.monthly_cost`) with
        current usage, the quota policy, the plan's contractual `included`
        limits, the per-user defaults and the org's per-user quota settings.

        Only what the gateway enforces carries usage; the `included` counters
        (members, agents, interactions, storage) are returned as configured in
        the plan, without usage.

        Requires the `models:read` permission. **Rate limiting.** 60 requests
        per 60 seconds per consumer.
      responses:
        '200':
          description: Organization quota status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgQuotasUsageResponse'
        '400':
          description: 'The caller has no active organization (`error: NO_ORG_CONTEXT`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing `models:read` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (`error: RATE_LIMITED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User-bound credential carrying an identity: either a session JWT
        or a user access token (`at:*`) generated from the user settings UI.
        Send as `Authorization: Bearer <token>`.
        Org API keys (`iak_*`) are **not** accepted here - they carry
        no user identity. Use the `x-prismeai-api-key` header instead
        (see `OrgApiKeyAuth`).
    OrgApiKeyAuth:
      type: apiKey
      in: header
      name: x-prismeai-api-key
      description: |
        Organization API key (`iak_{orgSlug}_{uuid}`). Unlike
        `Authorization: Bearer`, this credential is **not** tied to a user
        identity - it is bound to the org and its effective access is
        defined by the scopes / permission rules attached to it (it can
        be restricted to a single project, or kept broader).
        Send as `x-prismeai-api-key: iak_...`.

  schemas:
    Error:
      type: object
      required: [error]
      description: |
        Standard error envelope. `error` carries either a stable PascalCase
        identifier or a free-text label (legacy endpoints) - `code` is the
        canonical machine-readable identifier going forward.
      properties:
        error:
          type: string
          description: Stable PascalCase identifier or short error label.
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: |
            Machine-readable error code. Observed values include
            `RATE_LIMITED`, `MODEL_NOT_ALLOWED`, `HEADER_POLICY_VIOLATION`,
            `MODEL_NOT_FOUND`,
            `MODEL_EXISTS`, `MISSING_MODEL_ID`, `MISSING_TYPE`, `INVALID_BODY`,
            `BULK_REPLACE_FAILED`,
            `INVALID_ITEMS`, `INVALID_DIMENSIONS`, `PAYLOAD_TOO_LARGE`,
            `METHOD_NOT_ALLOWED`, `PROVIDER_ERROR`, `PROVIDER_NO_RESPONSE`.
        details:
          description: Optional structured context (e.g. list of invalid items).
          additionalProperties: true
        status:
          type: integer
          description: HTTP status mirror, when present.
        retryAfter:
          type: integer
          description: Seconds to wait before retrying (rate-limit responses).
        provider:
          type: string
          description: Upstream provider name (provider-error responses).
        model:
          type: string
          description: Model id involved in the error (provider-error responses).
        provider_error_type:
          type: string
          description: Upstream provider's own error class name.

    ChatMessage:
      type: object
      required: [role]
      description: A single message in a chat completion request or response.
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: Author role.
        content:
          description: |
            Message content. Either a plain string, or an array of typed parts
            (e.g. text + image) for multimodal inputs.
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        name:
          type: string
          description: Optional author name (e.g. function name for tool messages).
        tool_call_id:
          type: string
          description: 'For `role: tool`, the id of the tool call this message responds to.'
        tool_calls:
          type: array
          description: Tool calls emitted by an assistant message.
          items:
            $ref: '#/components/schemas/ToolCall'
        reasoning_details:
          type: array
          description: |
            Anthropic thinking blocks produced with this assistant message
            (`thinking` blocks carry `thinking` and `signature`,
            `redacted_thinking` blocks carry `data`). Returned by the gateway
            and meant to be sent back verbatim when the turn is replayed.
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
                enum: [thinking, redacted_thinking]
              thinking:
                type: string
              signature:
                type: string
              data:
                type: string
        reasoning_model:
          type: string
          description: |
            Gateway model id that produced `reasoning_details`. On replay the
            blocks are forwarded only when this matches the model being
            called; the tag itself is never sent to a provider.

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
          description: Provider-issued tool call identifier.
        type:
          type: string
          enum: [function]
          description: Tool kind. Currently always `function`.
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
              description: Function name.
            arguments:
              type: string
              description: |
                JSON-encoded arguments. Sent as a string (matches OpenAI's
                wire format).

    ChatCompletionRequest:
      type: object
      required: [messages]
      description: |
        OpenAI-compatible chat completion request. Only the fields actually
        accepted by the gateway are documented here.
      properties:
        model:
          type: string
          maxLength: 256
          description: |
            Model id from the catalogue (e.g. `gpt-4o`,
            `eu.anthropic.claude-sonnet-4-20250514-v1:0`,
            `vertex-gemini-2.5-flash`). Defaults to the gateway's
            `defaults.completions` model when omitted.
        messages:
          type: array
          description: Conversation history (system + user/assistant/tool turns).
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          description: Sampling temperature (provider-dependent range, typically 0 to 2).
        max_tokens:
          description: Max tokens to generate.
        max_completion_tokens:
          description: "Max tokens to generate, OpenAI's newer name for `max_tokens`. Either one is accepted; the gateway forwards a single `max_tokens` (the lower value when both are sent), capped to the model's `limits.max_response_tokens`. It is sent back as `max_completion_tokens` where the model requires it, through the model's `rename_params` or the provider's `parameterAliases`. A provider entry that excludes `max_tokens` without such a rename sends no output limit."
        top_p:
          description: Nucleus sampling parameter.
        frequency_penalty:
          description: OpenAI-style frequency penalty.
        presence_penalty:
          description: OpenAI-style presence penalty.
        stop:
          description: One or more stop sequences (string or array of strings).
        stream:
          type: boolean
          description: |
            When `true`, the response is a `text/event-stream` of
            `ChatCompletionChunk` deltas terminating with `data: [DONE]`.
        tools:
          type: array
          description: |
            Tool/function definitions made available to the model. Forwarded to
            providers that support tool calling.
          items:
            type: object
            additionalProperties: true
        tool_choice:
          description: |
            Tool selection hint: `"auto"`, `"none"`, `"required"`, or
            `{ type: "function", function: { name } }`.
        response_format:
          description: |
            OpenAI-style structured output hint
            (e.g. `{ "type": "json_object" }`).
          type: object
          additionalProperties: true
        seed:
          description: Provider seed for reproducible sampling (where supported).
        fallback_models:
          type: array
          maxItems: 5
          items:
            type: string
          description: |
            **Prisme.ai extension.** Ordered fallback models tried when the
            requested model fails (merged with the governance failover
            mapping). Each one is checked against the caller's access like
            the primary.
        task_id:
          type: string
          maxLength: 128
          description: |
            **Prisme.ai extension.** Opaque correlation id propagated to A2A
            (agent-to-agent) flows.
        analytics_context:
          type: object
          description: |
            **Prisme.ai extension.** Caller-supplied analytics context merged
            into the `analytics.llm.completion` event.
          additionalProperties: true
          properties:
            orgSlug:
              type: string
            agent_id:
              type: string
            user_id:
              type: string
            context_id:
              type: string
            agent_allowed_models:
              type: array
              items:
                type: string
            call_type:
              type: string
            message_turn:
              type: number
        prompt_cache:
          type: boolean
          description: |
            **Prisme.ai extension.** When omitted, prompt caching is on for
            conversations, i.e. requests that carry `prompt_cache_key` or
            `analytics_context.context_id`, and off for one-shot calls, whose
            cache write would never be read back. `true` turns it on even
            without a key; `false` turns it off. Caching means cache markers
            (Claude, Nova) and a cache key (OpenAI, Azure GPT, Mistral — on
            Mistral the key is what enables caching). The automatic caching of
            OpenAI / Azure GPT and Gemini cannot be switched off and stays
            active.
        prompt_cache_key:
          type: string
          maxLength: 256
          description: |
            **Prisme.ai extension** (standard OpenAI field). Cache routing key
            sent to OpenAI, Azure GPT and Mistral. Defaults to
            `analytics_context.context_id`. Ignored when `prompt_cache` is false.

    ChatCompletionResponse:
      type: object
      description: |
        Non-streaming chat completion response. Mirrors OpenAI's shape with
        Prisme.ai extensions on `usage` (`cost`, `duration_ms`, `carbon`).
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
          description: Generated id (`chatcmpl-<correlationId>`).
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          description: Unix timestamp (seconds).
        model:
          type: string
          description: Resolved model id used to serve the request.
        choices:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                description: |
                  `stop`, `length`, `tool_calls`, `content_filter`, or another
                  provider-specific value. Anthropic and Bedrock stop reasons
                  are normalised: unfinished answers (`max_tokens`,
                  `model_context_window_exceeded`, `pause_turn`) become
                  `length`, refusals (`refusal`, `guardrail_intervened`,
                  `content_filtered`) become `content_filter`, any other
                  present value becomes `stop`.
        usage:
          type: object
          description: Token, cost, and carbon accounting.
          properties:
            prompt_tokens:
              type: integer
              description: Total input tokens, cached context included.
            completion_tokens:
              type: integer
              description: |
                Total output tokens, reasoning **included**. Providers that report
                thinking separately (Gemini's `thoughtsTokenCount`) have it folded
                in by their adapter, so the figure is comparable across providers.
                `cost` is computed from it.
            completion_tokens_details:
              type: object
              description: |
                Breakdown of `completion_tokens`. Present when the provider reports
                one (OpenAI reasoning models, Gemini/Vertex). Absent otherwise:
                Anthropic and Bedrock do reason but publish no separate count, so
                the thinking stays inside `completion_tokens`.
              properties:
                reasoning_tokens:
                  type: integer
            cache_read_input_tokens:
              type: integer
              description: Cached input tokens re-read on this call (0 when caching is off).
            cache_write_input_tokens:
              type: integer
              description: Input tokens written to the provider cache (0 when caching is off or unbilled).
            total_tokens:
              type: integer
            cost:
              type: number
              format: double
              description: |
                **Prisme.ai extension.** Estimated USD cost computed from the
                model document's `pricing`. Prompt-cache tokens are priced at
                `pricing.cache_read_per_1m_tokens` / `pricing.cache_write_per_1m_tokens`
                (default: a provider ratio of the input price), the rest of the
                prompt at `input_per_1m_tokens`, the completion at `output_per_1m_tokens`.
            duration_ms:
              type: integer
              description: '**Prisme.ai extension.** Wall-clock duration of the call.'
            carbon:
              type: object
              description: |
                **Prisme.ai extension.** Carbon-footprint estimate produced by
                `_compute-carbon-footprint`. `details.region` is the carbon
                region used and `details.region_source` the rule that picked it:
                `model` (the model's override), `provider` (the entry's
                `carbon_region`), `bedrock-profile:<prefix>`, `bedrock:<aws
                region>`, `vertex:<location>` or `default` (world).
              additionalProperties: true
        failover:
          $ref: '#/components/schemas/FailoverInfo'

    ChatCompletionChunk:
      type: object
      description: |
        Single chunk in a streaming chat completion. Forwarded as the JSON
        payload of an SSE `data:` line. A literal `[DONE]` payload (not JSON)
        closes the delta sequence, followed by one final `chat.completion`
        frame shaped like `ChatCompletionResponse`.
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index:
                type: integer
              delta:
                type: object
                description: Incremental message delta.
                properties:
                  role:
                    type: string
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              finish_reason:
                type: string
        failover:
          allOf:
            - $ref: '#/components/schemas/FailoverInfo'
          description: Present on the first forwarded chunk when the gateway switched model.
        error:
          type: object
          description: |
            Present on the synthetic chunk emitted when the provider fails
            mid-stream. `choices[0].delta.content` then carries the same
            message for consumers that only read deltas.
          properties:
            message:
              type: string
            code:
              type: string
            provider:
              type: string
            model:
              type: string
            details:
              type: object
              additionalProperties: true
        usage:
          type: object
          description: |
            Present on the final chunk. Same fields as the non-streaming
            `usage` (`prompt_tokens`, `completion_tokens`, `total_tokens`,
            `completion_tokens_details.reasoning_tokens`,
            `cache_read_input_tokens`, `cache_write_input_tokens`).
          additionalProperties: true

    FailoverInfo:
      type: object
      description: |
        Reported when the requested model was attempted, failed, and a
        fallback answered instead. Absent when no switch happened.
      properties:
        from_model:
          type: string
          description: Model requested by the caller.
        to_model:
          type: string
          description: Model that actually answered.

    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          maxLength: 256
          description: Embedding model id from the catalogue.
        input:
          description: Either a single string or an array of strings to embed.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        dimensions:
          description: |
            Requested output dimensionality. Must be one of the model's
            `supported_dimensions` when set; otherwise rejected with
            `INVALID_DIMENSIONS`.
        analytics_context:
          type: object
          description: '**Prisme.ai extension.** Caller-supplied analytics context.'
          additionalProperties: true

    Embedding:
      type: object
      required: [object, index, embedding]
      properties:
        object:
          type: string
          enum: [embedding]
        index:
          type: integer
        embedding:
          type: array
          items:
            type: number
            format: float

    EmbeddingResponse:
      type: object
      description: |
        OpenAI-compatible embeddings response. When `input` was a single
        string, the response also exposes a flat root-level `embedding` field
        (Prisme.ai convenience extension) in addition to `data[0].embedding`.
      required: [object, model, data]
      properties:
        object:
          type: string
          enum: [list]
        model:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Embedding'
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
        embedding:
          type: array
          description: |
            **Prisme.ai extension.** Convenience copy of `data[0].embedding`
            present only when the request `input` was a single string.
          items:
            type: number
            format: float

    RerankRequest:
      type: object
      required: [query, documents]
      properties:
        model:
          type: string
          maxLength: 256
          description: |
            Reranker model id. Defaults to the gateway's configured completions
            default. Use `"mock"` for a deterministic, LLM-free response.
        query:
          type: string
          maxLength: 8192
          description: The search query to rank the documents against.
        documents:
          type: array
          maxItems: 200
          description: Candidate passages to rerank.
          items:
            type: string
            maxLength: 8192
        top_n:
          type: integer
          description: |
            Limit the number of returned results. Defaults to all documents; a
            value of 0 or less is ignored (returns all).
        max_tokens_per_doc:
          type: integer
          description: |
            Accepted for contract compatibility with native rerankers.
            Currently advisory (not enforced).
        analytics_context:
          type: object
          description: '**Prisme.ai extension.** Caller-supplied analytics context.'
          additionalProperties: true

    RerankResult:
      type: object
      required: [index, relevance_score]
      properties:
        index:
          type: integer
          description: Position of the document in the input `documents` array.
        relevance_score:
          type: number
          format: float
          description: Relevance of the document to the query, normalized to [0, 1].

    RerankResponse:
      type: object
      required: [id, results]
      properties:
        id:
          type: string
          description: Unique identifier for this rerank request.
        results:
          type: array
          description: Scored documents, sorted by `relevance_score` descending.
          items:
            $ref: '#/components/schemas/RerankResult'
        meta:
          type: object
          properties:
            model:
              type: string
            backend:
              type: string
              enum: [llm-as-reranker, mock]
            billed_units:
              type: object
              properties:
                input_tokens:
                  type: integer
                output_tokens:
                  type: integer

    ImageGenerationRequest:
      type: object
      properties:
        model:
          type: string
          maxLength: 256
          description: Image model id. Defaults to the org governance default, then the platform default.
        prompt:
          type: string
          description: Text description of the image to generate.
        size:
          type: string
          description: Explicit `WxH` pixel size. Kept as is when the model supports it, otherwise snapped (see `aspect` / `tier`).
          example: 1024x1024
        aspect:
          type: string
          enum: [square, portrait, landscape]
          description: '**Prisme.ai extension.** Abstract orientation, snapped to a size the model supports.'
        tier:
          type: string
          enum: [small, medium, large]
          description: '**Prisme.ai extension.** Size tier within the orientation (default `medium`).'
        style:
          type: string
          description: Provider style hint, forwarded to the provider when set.
        'n':
          type: number
          description: Number of images to generate (default 1).
        response_format:
          type: string
          enum: [url, b64_json]
          description: |
            Format requested from the provider (default `url`). The response
            always carries URLs: base64 results are uploaded and replaced by a
            `url`.
        analytics_context:
          type: object
          description: '**Prisme.ai extension.** Caller-supplied analytics context (`orgSlug`, `agent_id`, `user_id`, `context_id`, `agent_allowed_models`).'
          additionalProperties: true

    ImageEditRequest:
      type: object
      properties:
        model:
          type: string
          maxLength: 256
          description: Image model id. Defaults to the org governance default, then the platform default.
        prompt:
          type: string
          description: Instruction describing the edit.
        image_url:
          type: string
          description: URL of the source image, fetched by the gateway.
        size:
          type: string
          description: Explicit `WxH` pixel size (same resolution rules as generation).
        aspect:
          type: string
          enum: [square, portrait, landscape]
          description: '**Prisme.ai extension.** Abstract orientation.'
        tier:
          type: string
          enum: [small, medium, large]
          description: '**Prisme.ai extension.** Size tier (default `medium`).'
        'n':
          type: number
          description: Number of images to return (default 1).
        analytics_context:
          type: object
          description: '**Prisme.ai extension.** Caller-supplied analytics context.'
          additionalProperties: true

    ImagesResponse:
      type: object
      properties:
        created:
          type: integer
          description: Unix timestamp of the generation.
        model:
          type: string
          description: Model that produced the images (after governance resolution).
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: URL of the image (a tokenised Prisme.ai file URL when the provider returned base64).
        size:
          type: string
          description: '**Prisme.ai extension.** Size actually used after resolution.'
      example:
        created: 1767225600
        model: gpt-image-1
        size: 1024x1024
        data:
          - url: https://api.studio.prisme.ai/v2/files/file-abc.png?token=token-123

    QuotaGauge:
      type: object
      required: [key, scope, window, limit, used, percent]
      properties:
        key:
          type: string
          enum: [llm.rpm, llm.tpm, llm.monthly_tokens, llm.monthly_cost]
        scope:
          type: string
          enum: [user, org]
        window:
          type: string
          enum: [minute, month]
        limit:
          type: number
          description: Configured limit (requests, tokens or cost depending on `key`).
        used:
          type: number
          description: Current usage in the window (0 until a first request is recorded).
        percent:
          type: number
          description: '`used / limit` as a rounded percentage.'
        as_of:
          type: string
          format: date-time
          description: Time of the last recorded request (rate gauges only).

    MyQuotasResponse:
      type: object
      required: [computed_at, policy, gauges]
      properties:
        computed_at:
          type: string
          format: date-time
        policy:
          type: string
          description: Organization quota policy (`hard_block` by default, or `soft_downgrade`).
          example: hard_block
        display:
          type: object
          description: Organization display settings for the quota gauges (`settings.quotas.display`), when configured.
          additionalProperties: true
        gauges:
          type: array
          description: Configured limits only. Per-user gauges have `scope` `user`, monthly budgets `org`.
          items:
            $ref: '#/components/schemas/QuotaGauge'
      example:
        computed_at: '2026-01-15T10:00:00.000Z'
        policy: hard_block
        gauges:
          - key: llm.rpm
            scope: user
            window: minute
            limit: 20
            used: 9
            percent: 45
            as_of: '2026-01-15T09:59:40.000Z'
          - key: llm.monthly_tokens
            scope: org
            window: month
            limit: 10000000
            used: 6400000
            percent: 64

    OrgQuotasUsageResponse:
      type: object
      required: [orgSlug, computed_at, policy, enforced]
      properties:
        orgSlug:
          type: string
        computed_at:
          type: string
          format: date-time
        usage_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: Last refresh of the monthly usage aggregate (null when none this month).
        policy:
          type: string
          description: Organization quota policy (`hard_block` by default, or `soft_downgrade`).
        enforced:
          type: array
          description: Plan limits enforced by the gateway (`scope` `org`, `source` `plan`).
          items:
            allOf:
              - $ref: '#/components/schemas/QuotaGauge'
              - type: object
                properties:
                  source:
                    type: string
                    enum: [plan]
        included:
          description: Contractual limits included in the plan, as configured (no usage).
          additionalProperties: true
        per_user_defaults:
          type: object
          description: Plan default per-user limits (`rpm`, `tpm`).
          additionalProperties: true
        org_user_quotas:
          type: object
          description: Organization per-user quota settings (`overrides` by user, `by_role`).
          additionalProperties: true
      example:
        orgSlug: acme-corp
        computed_at: '2026-01-15T10:00:00.000Z'
        usage_refreshed_at: '2026-01-15T09:00:00.000Z'
        policy: hard_block
        enforced:
          - key: llm.monthly_tokens
            scope: org
            window: month
            limit: 10000000
            used: 6400000
            percent: 64
            source: plan
        per_user_defaults:
          rpm: 20
          tpm: 20000

    Model:
      type: object
      description: |
        Model catalogue document. The catalogue is the source of truth for
        provider routing, capabilities, pricing, and per-org availability.
      required: [model_id, type]
      properties:
        model_id:
          type: string
          maxLength: 128
          description: Stable identifier (matches the value sent in `request.model`).
        type:
          type: string
          maxLength: 64
          enum: [completion, embeddings, image_generation, transcription]
          description: Model family.
        display:
          type: object
          description: Display metadata (label, brand, hidden flag).
          properties:
            name:
              type: string
            brand:
              type: string
            hidden:
              type: boolean
        capabilities:
          type: object
          description: Flags advertising what the model supports.
          properties:
            vision:
              type: boolean
            audio:
              type: boolean
            text:
              type: boolean
            image:
              type: boolean
        limits:
          type: object
          description: Provider-side limits (e.g. context window, max tokens).
          additionalProperties: true
        failover:
          type: string
          maxLength: 128
          description: Optional `model_id` to route to when the primary fails.
        region:
          type: string
          maxLength: 64
          nullable: true
          enum: [world, eu-west, eu-north, us-east, us-west, asia, null]
          description: |
            Optional carbon-region override. `null` (default) = the region the
            provider entry serving the model gives: its `carbon_region`, else
            the Bedrock inference-profile prefix (`global.` → world, `eu.` →
            eu-west…) or AWS region, else the Vertex location. Set it only for
            a model that runs elsewhere. An unknown value is refused (400
            `INVALID_REGION`).
        end_of_life:
          type: string
          format: date
          nullable: true
          description: Announced end-of-life date of the model (`YYYY-MM-DD`). Informational, routing continues.
        dimensions:
          description: Default embedding dimensionality (embeddings models only).
        supported_dimensions:
          type: array
          description: Allowed values for the request `dimensions` parameter.
          items:
            type: number
        metrics:
          description: Free-form metrics block (latency, throughput hints, …).
        provider_config:
          type: object
          description: Provider-specific configuration (batch size, parallelism, …).
          additionalProperties: true
          properties:
            exclude_params:
              type: array
              items:
                type: string
              description: Request-body parameters dropped for this model (on top of the provider's own exclusions), e.g. `temperature` on a reasoning model.
            rename_params:
              type: object
              additionalProperties:
                type: string
              description: 'Request-body parameters renamed for this model, e.g. `{"max_tokens": "max_completion_tokens"}`.'
            api:
              type: string
              enum: [chat_completions, responses]
              description: Upstream API the model is called with. Absent = `chat_completions`. `responses` is needed by models that refuse function tools with a `reasoning_effort` on Chat Completions (GPT-6 family). Prefilled from the catalogue when the model is created, never changed by the catalogue sync.
        pricing:
          type: object
          description: Cost configuration used to compute `usage.cost`.
          properties:
            input_per_1m_tokens:
              type: number
              format: double
            output_per_1m_tokens:
              type: number
              format: double
            cache_read_per_1m_tokens:
              type: number
              format: double
              description: |
                Price of 1M input tokens read from the provider's prompt cache
                (0 = free). Optional: defaults to the input price × the provider ratio
                (claude 0.1, gpt-4o 0.5, gpt-4.1/o3/o4 0.25, others 0.1).
            cache_write_per_1m_tokens:
              type: number
              format: double
              description: |
                Price of 1M input tokens written to the provider's prompt cache
                (Anthropic, 0 = free). Optional: defaults to the input price × 1.25 for
                claude, × 1 otherwise.
        tags:
          type: array
          description: Free-form tags used by the search/filter UI.
          items:
            type: string
        org_slugs:
          type: array
          description: |
            When set and non-empty, restricts the model to the listed
            organizations. Empty / missing means the model is available to all
            orgs (subject to governance overlays).
          items:
            type: string
        enabled:
          type: boolean
          description: When `false`, the model is hidden from routing.

    ModelCreateInput:
      type: object
      description: |
        Write-shape for `POST /v1/models` and each item of `PUT /v1/models`.
        `model_id` and `type` are required.
      required: [model_id, type]
      properties:
        model_id:
          type: string
          maxLength: 128
        type:
          type: string
          maxLength: 64
          enum: [completion, embeddings, image_generation, transcription]
        display:
          type: object
        capabilities:
          type: object
        limits:
          type: object
        failover:
          type: string
          maxLength: 128
        region:
          type: string
          maxLength: 64
          nullable: true
          enum: [world, eu-west, eu-north, us-east, us-west, asia, null]
        end_of_life:
          type: string
          format: date
          nullable: true
        dimensions: {}
        supported_dimensions: {}
        metrics: {}
        provider_config: {}
        pricing: {}
        tags: {}
        org_slugs: {}
        enabled: {}

    ModelUpdateInput:
      type: object
      description: |
        Partial-update shape for `PATCH /v1/models/{modelId}`. Only fields
        present in the body are applied. `model_id` is taken from the path,
        not the body.
      properties:
        type:
          type: string
          maxLength: 64
          enum: [completion, embeddings, image_generation, transcription]
        display:
          type: object
        capabilities:
          type: object
        limits:
          type: object
        failover:
          type: string
          maxLength: 128
        region:
          type: string
          maxLength: 64
          nullable: true
          enum: [world, eu-west, eu-north, us-east, us-west, asia, null]
        end_of_life:
          type: string
          format: date
          nullable: true
        dimensions: {}
        supported_dimensions: {}
        metrics: {}
        provider_config: {}
        pricing: {}
        tags: {}
        org_slugs: {}
        enabled: {}

    ModelRegions:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [world, eu-west, eu-north, us-east, us-west, asia]
              label:
                type: object
                properties:
                  fr:
                    type: string
                  en:
                    type: string
              emission_factor:
                type: number
                format: double
                description: Grid emission factor, kg CO2eq/kWh.
        default:
          type: string
          description: Region the footprint uses when neither the model nor its provider entry gives one (`world`).
        suggested:
          type: string
          nullable: true
          description: Suggested region id for `model_id`.
        source:
          type: string
          nullable: true
          description: Where the suggestion comes from — `provider`, or `bedrock:<aws region>`.

    ProviderModels:
      type: object
      properties:
        provider:
          type: string
        index:
          type: integer
        entry:
          type: object
          description: Non-secret identity of the entry, to check it is the expected one.
          properties:
            endpoint:
              type: string
              nullable: true
            resource:
              type: string
              nullable: true
            region:
              type: string
              nullable: true
            host:
              type: string
              nullable: true
            carbon_region:
              type: string
              nullable: true
        total:
          type: integer
        errors:
          type: array
          description: Partial failures, e.g. a Vertex publisher that refused to list (its models are missing); the upstream details go to an `error` event.
          items:
            type: object
            properties:
              publisher:
                type: string
              message:
                type: string
        models:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id]
            properties:
              id:
                type: string
                description: Value to declare in the entry's model list (Azure deployment name, Bedrock model or inference profile id, Vertex resource path…).
              declared:
                type: boolean
                description: Already listed in the entry, directly or through a `model_aliases` alias.
              declared_as:
                type: string
                nullable: true
                description: The public id the entry declares for this model (the id itself, or its alias).
              registered:
                type: boolean
                description: Already registered in the models collection.

    ModelsListResponse:
      type: object
      description: |
        Pagination envelope used by `GET /v1/models` (Prisme.ai standard, not
        OpenAI's `{ object: "list", data: [...] }`).
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        total:
          type: integer
          description: Total number of matching documents (ignoring pagination).
        page:
          type: integer
          description: Zero-based page index.
        limit:
          type: integer
          description: Effective page size (server-capped at 100).

    Defaults:
      type: object
      description: Resolved default models per concern.
      properties:
        completions:
          type: object
          required: [model_id]
          properties:
            model_id:
              type: string
        embeddings:
          type: object
          required: [model_id]
          properties:
            model_id:
              type: string
            dimensions:
              type: number
              description: Default embedding dimensionality (when known).
            supported_dimensions:
              type: array
              items:
                type: number
        image_generation:
          type: object
          required: [model_id]
          properties:
            model_id:
              type: string
        transcription:
          type: object
          description: |
            Speech-to-text model used by chat dictation. An empty `model_id`
            means no transcription model is configured, or that the caller may
            not use it.
          properties:
            model_id:
              type: string
            browser_fallback:
              type: boolean
              description: |
                Whether a client with no usable `model_id` may dictate with the
                browser's own speech service (desktop Chrome / Edge), which
                sends the audio to the browser vendor. False when the platform
                (`config.defaults.browser_dictation`) or the org
                (`allow_browser_dictation`) turns it off, when a transcription
                model exists but the caller was refused the audio-transcriptions
                permission (the permission is not checked without a model), or
                when the access check failed.
        file_parsing:
          type: object
          description: Per-input-kind defaults for file-parsing flows.
          properties:
            image:
              type: object
              properties:
                model_id:
                  type: string
            audio:
              type: object
              properties:
                model_id:
                  type: string
            document:
              type: object
              properties:
                model_id:
                  type: string

    TestRequest:
      type: object
      required: [modelId]
      properties:
        modelId:
          type: string
          maxLength: 256
          description: Model id to test.
        type:
          type: string
          maxLength: 32
          enum: [embeddings, completions, image_generation]
          description: |
            Kind of test to run. Defaults to `completions` when omitted.
            `image_generation` generates one test image (image models cannot be
            reached through chat completions).

    TestResponse:
      type: object
      required: [ok, response]
      properties:
        ok:
          type: boolean
          description: '`true` when the underlying provider call succeeded.'
        dimensions:
          type: integer
          description: 'Returned only for `type: "embeddings"` (length of the embedding vector).'
        response:
          description: |
            Raw provider payload on success, or the captured `$error` object on
            failure (free-form).
          type: object
          additionalProperties: true
