<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <style>
      .lbl{font-size:12px;font-weight:700}
      .val{font-size:12px;font-weight:700}
      .sub{font-size:10px}
      .ct{font-size:12.5px;font-weight:700}
      .cb{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect x="20" y="20" width="1160" height="490" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">Governance is a cascade of envelopes</text>
  <text x="600" y="80" text-anchor="middle" font-size="12.5" fill="#64748B">Each level can only tighten the one above, never widen it. On conflict the tightest limit wins. Inside its own envelope, each level distributes freely.</text>

  <!-- nested envelopes -->
  <rect x="56" y="104" width="520" height="300" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="76" y="128" class="lbl" fill="#4F46E5">PLATFORM PLAN · superadmin</text>
  <text x="556" y="128" text-anchor="end" class="val" fill="#4F46E5">1000</text>

  <rect x="92" y="150" width="448" height="214" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="112" y="174" class="lbl" fill="#1D4ED8">ORGANIZATION · admin</text>
  <text x="520" y="174" text-anchor="end" class="val" fill="#1D4ED8">600</text>

  <rect x="132" y="196" width="368" height="134" rx="12" fill="#F5F3FF" stroke="#6B47D9" stroke-width="1.8"/>
  <text x="152" y="220" class="lbl" fill="#5B21B6">AGENT · creator</text>
  <text x="480" y="220" text-anchor="end" class="val" fill="#5B21B6">300</text>

  <rect x="180" y="244" width="272" height="66" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="316" y="274" text-anchor="middle" class="lbl" fill="#0F766E">USER · effective</text>
  <text x="316" y="294" text-anchor="middle" class="val" fill="#0F766E">200  (the tightest applies)</text>

  <text x="76" y="392" class="sub" fill="#6366F1">Agent ≤ Org ≤ Plan. Each envelope sits inside the one above.</text>

  <!-- principle cards -->
  <rect x="624" y="104" width="524" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="644" y="132" class="ct" fill="#0F172A">1 · Restrict only, downward</text>
  <text x="644" y="156" class="cb">A level can lower the ceiling above it, never raise it.</text>
  <text x="644" y="174" class="cb">So Agent ≤ Org ≤ Plan, always.</text>

  <rect x="624" y="200" width="524" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="644" y="228" class="ct" fill="#0F172A">2 · The tightest wins</text>
  <text x="644" y="252" class="cb">When limits conflict across levels, the effective quota is the</text>
  <text x="644" y="270" class="cb">smallest applicable one. The creator can cap a user of the agent; the org can cap a member.</text>

  <rect x="624" y="296" width="524" height="108" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="644" y="324" class="ct" fill="#3730A3">3 · Distribute freely within your envelope (§8.8)</text>
  <text x="644" y="348" class="cb" fill="#4338CA">"Restrict" applies to the envelopes between levels. Inside its own envelope,</text>
  <text x="644" y="366" class="cb" fill="#4338CA">a level allocates as it likes: an org can grant a power user more than the plan</text>
  <text x="644" y="384" class="cb" fill="#4338CA">default (e.g. 400 &gt; 100), as long as it stays ≤ the org ceiling (600).</text>

  <!-- exec summary band -->
  <rect x="56" y="420" width="1092" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="602" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">The superadmin protects the platform, the org protects and distributes, the agent creator protects their agent.</text>
  <text x="602" y="464" text-anchor="middle" font-size="11.5" fill="#64748B">Each can only restrict the level above, never widen it. On conflict, the most restrictive wins.</text>
</svg>
