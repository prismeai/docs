<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4480ed"/></marker>
    <style>
      .kick{font-size:11px;font-weight:700;letter-spacing:1px}
      .chipn{font-size:11.5px;font-weight:700;fill:#0F172A}
      .chips{font-size:8.5px;fill:#94A3B8}
      .ct{font-size:9.5px;font-weight:700;letter-spacing:0.3px;fill:#FFFFFF}
      .cb{font-size:10px;fill:#334155}
      .cs{font-size:8.5px;fill:#94A3B8}
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="478" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Everything is a workspace, even the products</text>
  <text x="600" y="80" text-anchor="middle" font-size="12.5" fill="#64748B">Products are full-stack workspaces. Builder is the tool that creates them and opens them to edit. What you import is an App (a published, pinned workspace, an SDK).</text>

  <!-- products row (6, Builder is NOT a product-workspace) -->
  <text x="90" y="116" class="kick" fill="#475569">PRODUCTS ARE FULL-STACK WORKSPACES</text>
  <g>
    <rect x="90" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="126" width="6" height="46" rx="3" fill="#4480ed"/>
    <text x="170" y="149" text-anchor="middle" class="chipn">Chat</text><text x="170" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
    <rect x="262" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="262" y="126" width="6" height="46" rx="3" fill="#4480ed"/>
    <text x="342" y="149" text-anchor="middle" class="chipn">Agent Creator</text><text x="342" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
    <rect x="434" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="434" y="126" width="6" height="46" rx="3" fill="#4480ed"/>
    <text x="514" y="149" text-anchor="middle" class="chipn">Knowledges</text><text x="514" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
    <rect x="606" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="606" y="126" width="6" height="46" rx="3" fill="#4480ed"/>
    <text x="686" y="149" text-anchor="middle" class="chipn">Collections</text><text x="686" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
    <rect x="778" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="778" y="126" width="6" height="46" rx="3" fill="#6aa0f5"/>
    <text x="858" y="149" text-anchor="middle" class="chipn">Insights</text><text x="858" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
    <rect x="950" y="126" width="160" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="950" y="126" width="6" height="46" rx="3" fill="#4480ed"/>
    <text x="1030" y="149" text-anchor="middle" class="chipn">Engage</text><text x="1030" y="164" text-anchor="middle" class="chips">full-stack workspace</text>
  </g>

  <!-- App / SDK source, sits over the Imports compartment -->
  <rect x="640" y="190" width="220" height="52" rx="10" fill="#f2f6ff" stroke="#4480ed" stroke-width="1.6"/>
  <text x="654" y="208" class="kick" fill="#4480ed" font-size="9.5">APP / SDK (imported)</text>
  <text x="654" y="226" font-size="11" font-weight="600" fill="#2541a8">Agent Factory App · pinned</text>
  <path d="M750,242 L750,268" fill="none" stroke="#4480ed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="770" y="262" font-size="10" font-weight="700" fill="#4480ed">import</text>

  <!-- a workspace, opened in Builder -->
  <rect x="360" y="270" width="780" height="176" rx="16" fill="#F8FAFC" stroke="#255be0" stroke-width="2"/>
  <text x="382" y="296" class="kick" fill="#1E293B">A WORKSPACE</text>
  <rect x="512" y="282" width="150" height="20" rx="10" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="587" y="296" text-anchor="middle" font-size="9.5" fill="#255be0">opened in Builder</text>
  <rect x="1030" y="280" width="94" height="24" rx="12" fill="#eef4ff" stroke="#c2dafb"/>
  <text x="1077" y="296" text-anchor="middle" font-size="10" fill="#255be0">slug: my-app</text>

  <g>
    <rect x="380" y="310" width="138" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="380" y="310" width="138" height="26" rx="10" fill="#255be0"/><rect x="380" y="323" width="138" height="13" fill="#255be0"/>
    <text x="390" y="328" class="ct">PAGES</text><text x="390" y="358" class="cb">React UI</text>

    <rect x="530" y="310" width="138" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="530" y="310" width="138" height="26" rx="10" fill="#4480ed"/><rect x="530" y="323" width="138" height="13" fill="#4480ed"/>
    <text x="540" y="328" class="ct">AUTOMATIONS</text><text x="540" y="358" class="cb">Agentic flows</text><text x="540" y="374" class="cs">+ SDK instructions</text>

    <rect x="680" y="310" width="138" height="120" rx="10" fill="#eef4ff" stroke="#4480ed" stroke-width="2"/>
    <rect x="680" y="310" width="138" height="26" rx="10" fill="#4480ed"/><rect x="680" y="323" width="138" height="13" fill="#4480ed"/>
    <text x="690" y="328" class="ct">IMPORTS</text><text x="690" y="358" class="cb">Apps / SDKs</text><text x="690" y="374" class="cs">published, pinned</text>

    <rect x="830" y="310" width="138" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="830" y="310" width="138" height="26" rx="10" fill="#4480ed"/><rect x="830" y="323" width="138" height="13" fill="#4480ed"/>
    <text x="840" y="328" class="ct">FILES</text><text x="840" y="358" class="cb">PDF · assets</text>

    <rect x="980" y="310" width="138" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="980" y="310" width="138" height="26" rx="10" fill="#6aa0f5"/><rect x="980" y="323" width="138" height="13" fill="#6aa0f5"/>
    <text x="990" y="328" class="ct">ACTIVITY</text><text x="990" y="358" class="cb">Execution activity</text><text x="990" y="374" class="cs">(was "events")</text>
  </g>

  <text x="600" y="466" text-anchor="middle" font-size="11" fill="#64748B">Builder creates workspaces and opens them (Pages, Automations, Imports, Files, Activity). Agent Creator is the product; Agent Factory App is the SDK you import.</text>
</svg>
