<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="From no-code, full-code or a prompt, Builder produces a web app, an agent, a workflow, an agentic workflow, or full-stack">
  <defs>
    <linearGradient id="bf-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4480ED"/>
      <stop offset="1" stop-color="#255BE0"/>
    </linearGradient>
    <filter id="bf-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .bf-flow{stroke-dasharray:5 12;animation:bf-fl 1.9s linear infinite}
      @keyframes bf-fl{to{stroke-dashoffset:-68}}
      .bf-pulse{animation:bf-pu 3.2s ease-in-out infinite}
      @keyframes bf-pu{0%,100%{opacity:.85}50%{opacity:1}}
      .bf-bob{transform-box:fill-box;transform-origin:center;animation:bf-bob 6s ease-in-out infinite}
      @keyframes bf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .d1{animation-delay:0s}.d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}.d5{animation-delay:1.6s}
      .bf-t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .bf-m{font-family:ui-monospace,"IBM Plex Mono",monospace}
      @media (prefers-reduced-motion:reduce){.bf-flow,.bf-pulse,.bf-bob{animation:none}}
    </style>
  </defs>

  <ellipse cx="240" cy="278" rx="180" ry="26" fill="#255BE0" opacity="0.10" filter="url(#bf-soft)"/>

  <!-- outputs: what you build -->
  <g class="bf-pulse d1">
    <line x1="144" y1="150" x2="308" y2="46" stroke="#98C3F8" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="144" y1="150" x2="308" y2="46" stroke="#98C3F8" stroke-width="2" class="bf-flow d1"/>
    <rect x="308" y="28" width="158" height="36" rx="11" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="328" cy="46" r="5" fill="#98C3F8"/>
    <text x="342" y="51" class="bf-t" font-size="13" fill="#16203a">Web App</text>
  </g>
  <g class="bf-pulse d2">
    <line x1="144" y1="150" x2="308" y2="98" stroke="#4480ED" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="144" y1="150" x2="308" y2="98" stroke="#4480ED" stroke-width="2" class="bf-flow d2"/>
    <rect x="308" y="80" width="158" height="36" rx="11" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="328" cy="98" r="5" fill="#4480ED"/>
    <text x="342" y="103" class="bf-t" font-size="13" fill="#16203a">Agent</text>
  </g>
  <g class="bf-pulse d3">
    <line x1="144" y1="150" x2="308" y2="150" stroke="#2E6BE6" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="144" y1="150" x2="308" y2="150" stroke="#2E6BE6" stroke-width="2" class="bf-flow d3"/>
    <rect x="308" y="132" width="158" height="36" rx="11" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="328" cy="150" r="5" fill="#2E6BE6"/>
    <text x="342" y="155" class="bf-t" font-size="13" fill="#16203a">Workflow</text>
  </g>
  <g class="bf-pulse d4">
    <line x1="144" y1="150" x2="308" y2="202" stroke="#255BE0" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="144" y1="150" x2="308" y2="202" stroke="#255BE0" stroke-width="2" class="bf-flow d4"/>
    <rect x="308" y="184" width="158" height="36" rx="11" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="328" cy="202" r="5" fill="#255BE0"/>
    <text x="342" y="207" class="bf-t" font-size="13" fill="#16203a">Agentic workflow</text>
  </g>
  <g class="bf-pulse d5">
    <line x1="144" y1="150" x2="308" y2="254" stroke="#6AA0F5" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="144" y1="150" x2="308" y2="254" stroke="#6AA0F5" stroke-width="2" class="bf-flow d5"/>
    <rect x="308" y="236" width="158" height="36" rx="11" fill="#FFFFFF" stroke="#E3E6EC"/>
    <circle cx="328" cy="254" r="5" fill="#6AA0F5"/>
    <text x="342" y="259" class="bf-t" font-size="13" fill="#16203a">Full-stack</text>
  </g>

  <!-- Builder: the three ways to build -->
  <ellipse cx="81" cy="206" rx="58" ry="10" fill="#255BE0" opacity="0.16" filter="url(#bf-soft)"/>
  <g class="bf-bob">
    <rect x="18" y="100" width="126" height="100" rx="18" fill="url(#bf-core)" stroke="rgba(255,255,255,.45)"/>
    <text x="81" y="128" text-anchor="middle" class="bf-t" font-size="15" font-weight="700" fill="#ffffff">Builder</text>
    <text x="81" y="150" text-anchor="middle" class="bf-m" font-size="10.5" fill="#dbe7ff">no-code</text>
    <text x="81" y="166" text-anchor="middle" class="bf-m" font-size="10.5" fill="#dbe7ff">full-code</text>
    <text x="81" y="182" text-anchor="middle" class="bf-m" font-size="10.5" fill="#dbe7ff">prompt</text>
  </g>
</svg>
