<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <style>.grp{font-size:9px;font-weight:700;letter-spacing:1px;fill:#94A3B8}.it{font-size:11.5px;fill:#334155}</style>
  </defs>
  <rect x="20" y="20" width="1060" height="500" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="550" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Add your own product to the platform menu</text>
  <text x="550" y="74" text-anchor="middle" font-size="12" fill="#64748B">Any workspace you publish gets a slug, and you can pin it to your organization's menu, gated by permissions.</text>

  <!-- sidebar mockup -->
  <rect x="50" y="96" width="280" height="416" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="124" font-size="13" font-weight="700" fill="#0F172A">Prisme.ai</text>

  <text x="70" y="150" class="grp">USE</text>
  <circle cx="76" cy="168" r="3" fill="#4D7CFF"/><text x="88" y="172" class="it">Chat</text>
  <circle cx="76" cy="188" r="3" fill="#4D7CFF"/><text x="88" y="192" class="it">Store</text>

  <text x="70" y="216" class="grp">CREATE</text>
  <circle cx="76" cy="234" r="3" fill="#6B47D9"/><text x="88" y="238" class="it">Agent Creator</text>
  <circle cx="76" cy="254" r="3" fill="#F97316"/><text x="88" y="258" class="it">Knowledges</text>
  <circle cx="76" cy="274" r="3" fill="#0EA5E9"/><text x="88" y="278" class="it">Collections</text>
  <circle cx="76" cy="294" r="3" fill="#3B82F6"/><text x="88" y="298" class="it">Builder</text>

  <text x="70" y="322" class="grp">MONITOR</text>
  <circle cx="76" cy="340" r="3" fill="#EC4899"/><text x="88" y="344" class="it">Insights</text>

  <text x="70" y="368" class="grp">RUN</text>
  <circle cx="76" cy="386" r="3" fill="#14B8A6"/><text x="88" y="390" class="it">Engage</text>
  <circle cx="76" cy="406" r="3" fill="#6366F1"/><text x="88" y="410" class="it">Governe</text>

  <!-- custom, highlighted -->
  <text x="70" y="440" class="grp" fill="#3B82F6">YOUR PRODUCTS</text>
  <rect x="60" y="450" width="260" height="34" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <circle cx="80" cy="467" r="4" fill="#3B82F6"/><text x="94" y="471" font-size="12" font-weight="700" fill="#1D4ED8">Your CRM portal</text>
  <rect x="236" y="458" width="72" height="18" rx="9" fill="#FFFFFF" stroke="#BFD3FF"/><text x="272" y="471" text-anchor="middle" font-size="8.5" fill="#2563EB">added by you</text>

  <!-- arrow to annotation -->
  <line x1="326" y1="467" x2="418" y2="467" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- annotation -->
  <rect x="430" y="150" width="600" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="456" y="184" font-size="14" font-weight="700" fill="#0F172A">How to add it</text>
  <text x="456" y="216" font-size="12.5" fill="#334155">1. Build a workspace and publish it. It gets a slug.</text>
  <text x="456" y="248" font-size="12.5" fill="#334155">2. In Governe, open Appearance, the menu editor.</text>
  <text x="456" y="280" font-size="12.5" fill="#334155">3. Pin the workspace to the menu.</text>
  <text x="456" y="312" font-size="12.5" fill="#334155">4. Choose who sees it, by role or group.</text>
  <rect x="456" y="342" width="548" height="66" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="472" y="368" font-size="11.5" font-weight="700" fill="#3730A3">Your custom product sits next to the built-in ones,</text>
  <text x="472" y="386" font-size="11.5" fill="#4338CA">on the same governed platform. The built-in products are workspaces too.</text>
  <text x="456" y="430" font-size="10" fill="#94A3B8">Illustrative. Menu items depend on your organization's configuration and your permissions.</text>
</svg>
