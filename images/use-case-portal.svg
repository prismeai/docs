<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <style>.k{font-size:11px;font-weight:700;letter-spacing:0.8px}.r{font-size:12px;fill:#334155}.s{font-size:10px;fill:#94A3B8}</style>
  </defs>
  <rect x="20" y="20" width="1160" height="440" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">One pattern, many custom portals</text>
  <text x="600" y="77" text-anchor="middle" font-size="12.5" fill="#64748B">Connect your systems, add agents and workflows behind a React front-end, deliver to your channels, all governed.</text>

  <!-- Left: systems & data -->
  <rect x="50" y="104" width="300" height="256" rx="14" fill="#eef4ff" stroke="#c2dafb"/>
  <text x="72" y="130" class="k" fill="#2541a8">YOUR SYSTEMS &amp; DATA</text>
  <rect x="72" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="166" class="r">CRM · ITSM · ERP</text>
  <rect x="72" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="204" class="r">Databases &amp; files</text>
  <rect x="72" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="242" class="r">Legacy apps &amp; APIs</text>
  <rect x="72" y="260" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="280" class="r">SharePoint · cloud storage</text>
  <text x="72" y="316" class="s">connected via connectors &amp; MCP, no rebuild</text>

  <line x1="356" y1="232" x2="434" y2="232" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Center: the portal -->
  <rect x="440" y="104" width="320" height="256" rx="14" fill="#F8FAFC" stroke="#255be0" stroke-width="2"/>
  <text x="462" y="130" class="k" fill="#2541a8">THE PORTAL · built in Builder</text>
  <rect x="462" y="146" width="276" height="30" rx="8" fill="#eef4ff" stroke="#c2dafb"/><text x="476" y="166" class="r" fill="#2541a8">React front-end (the experience)</text>
  <rect x="462" y="184" width="276" height="30" rx="8" fill="#f2f6ff" stroke="#c2dafb"/><text x="476" y="204" class="r" fill="#2541a8">Agentic workflows</text>
  <rect x="462" y="222" width="276" height="30" rx="8" fill="#f2f6ff" stroke="#c2dafb"/><text x="476" y="242" class="r" fill="#2541a8">Agents (your skills + knowledge)</text>
  <rect x="462" y="260" width="276" height="30" rx="8" fill="#eef4ff" stroke="#c2dafb"/><text x="476" y="280" class="r" fill="#2541a8">Knowledges &amp; Collections</text>
  <text x="462" y="316" class="s">one stack, versioned in Git</text>

  <line x1="766" y1="232" x2="844" y2="232" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Right: channels -->
  <rect x="850" y="104" width="300" height="256" rx="14" fill="#eef4ff" stroke="#c2dafb"/>
  <text x="872" y="130" class="k" fill="#2541a8">YOUR CHANNELS</text>
  <rect x="872" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="166" class="r">Web portal</text>
  <rect x="872" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="204" class="r">Microsoft Teams · WhatsApp</text>
  <rect x="872" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="242" class="r">Chat &amp; Store</text>
  <rect x="872" y="260" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="280" class="r">Website embed · mobile</text>
  <text x="872" y="316" class="s">where your people already work</text>

  <!-- bottom band -->
  <rect x="50" y="384" width="1100" height="58" rx="12" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="600" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#233b85">Governed and traceable: SSO, roles, audit, quotas, retention</text>
  <text x="600" y="428" text-anchor="middle" font-size="11.5" fill="#2541a8">Deploy on SaaS to start, move to self-hosted when criticality or sovereignty require it. Your choice.</text>
</svg>
