<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#CBD5E1"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="480" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Where are you in your Gen.AI journey?</text>
  <text x="600" y="77" text-anchor="middle" font-size="12.5" fill="#64748B">Most enterprises are past experimentation. The work now is scaling to measurable ROI, with governance and freedom of choice.</text>

  <!-- axes -->
  <line x1="120" y1="432" x2="120" y2="112" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="120" y1="432" x2="1140" y2="432" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text transform="rotate(-90 76 272)" x="76" y="272" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">MATURITY</text>
  <text x="630" y="456" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">VALUE AT SCALE · ROI</text>
  <text x="150" y="456" text-anchor="middle" font-size="13" fill="#94A3B8">-</text>
  <text x="1120" y="456" text-anchor="middle" font-size="13" fill="#94A3B8">+</text>

  <!-- rising path -->
  <line x1="185" y1="416" x2="1080" y2="176" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>

  <!-- 1 Adopt -->
  <rect x="150" y="336" width="330" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="336" width="8" height="88" rx="4" fill="#3B82F6"/>
  <text x="176" y="362" font-size="14" font-weight="700" fill="#1D4ED8">1 · Adopt</text>
  <text x="464" y="360" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Emerging</text>
  <text x="176" y="384" font-size="11.5" fill="#334155">Secure, multi-LLM chat for everyone</text>
  <text x="176" y="404" font-size="10.5" fill="#64748B">Chat · Store</text>

  <!-- 2 Specialize -->
  <rect x="485" y="246" width="330" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="485" y="246" width="8" height="88" rx="4" fill="#6B47D9"/>
  <text x="511" y="272" font-size="14" font-weight="700" fill="#5B21B6">2 · Specialize</text>
  <text x="799" y="270" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Operational</text>
  <text x="511" y="294" font-size="11.5" fill="#334155">Agents grounded on your knowledge</text>
  <text x="511" y="314" font-size="10.5" fill="#64748B">Agent Creator · Knowledges · Insights</text>

  <!-- 3 Scale & transform -->
  <rect x="810" y="156" width="330" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="810" y="156" width="8" height="88" rx="4" fill="#14B8A6"/>
  <text x="836" y="182" font-size="14" font-weight="700" fill="#0F766E">3 · Scale &amp; transform</text>
  <text x="1124" y="180" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Scaled</text>
  <text x="836" y="204" font-size="11" fill="#334155">Custom apps, mutualized infra, lower software costs</text>
  <text x="836" y="224" font-size="10.5" fill="#64748B">Builder · Collections · connectors &amp; MCP</text>

  <!-- cross-cutting band -->
  <rect x="150" y="470" width="990" height="26" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="645" y="487" text-anchor="middle" font-size="11" fill="#4338CA">At every stage: Governance (central and delegated) · Sovereignty as freedom of cloud and model · Resilience</text>
</svg>
