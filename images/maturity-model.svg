<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#CBD5E1"/></marker>
    <marker id="big" markerWidth="12" markerHeight="12" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#255be0"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="520" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Where are you in building your AI Information System?</text>
  <text x="600" y="77" text-anchor="middle" font-size="12.5" fill="#64748B">From secure chat to a scalable, AI-by-design system. Each stage is in production today with pioneering enterprises.</text>

  <!-- axes -->
  <line x1="120" y1="456" x2="120" y2="112" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="120" y1="456" x2="1150" y2="456" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text transform="rotate(-90 76 288)" x="76" y="288" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">MATURITY</text>
  <text x="635" y="480" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">VALUE AT SCALE · ROI</text>
  <text x="150" y="480" text-anchor="middle" font-size="13" fill="#94A3B8">-</text>
  <text x="1130" y="480" text-anchor="middle" font-size="13" fill="#94A3B8">+</text>

  <!-- aspirational path -->
  <line x1="180" y1="432" x2="1080" y2="176" stroke="#255be0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#big)"/>
  <text transform="rotate(-16 628 300)" x="628" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#255be0">with Prisme.ai</text>

  <!-- 1 Adopt -->
  <rect x="140" y="348" width="340" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="140" y="348" width="8" height="96" rx="4" fill="#255be0"/>
  <text x="166" y="374" font-size="14.5" font-weight="700" fill="#2541a8">1 · Adopt</text>
  <text x="466" y="372" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Emerging</text>
  <text x="166" y="396" font-size="11.5" fill="#334155">Secure, multi-LLM chat for everyone</text>
  <rect x="166" y="410" width="52" height="22" rx="11" fill="#eef4ff" stroke="#c2dafb"/><text x="192" y="425" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Chat</text>
  <rect x="226" y="410" width="56" height="22" rx="11" fill="#eef4ff" stroke="#c2dafb"/><text x="254" y="425" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Store</text>

  <!-- 2 Specialize -->
  <rect x="470" y="250" width="400" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="470" y="250" width="8" height="96" rx="4" fill="#4480ed"/>
  <text x="496" y="276" font-size="14.5" font-weight="700" fill="#2541a8">2 · Specialize</text>
  <text x="856" y="274" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Operational</text>
  <text x="496" y="298" font-size="11.5" fill="#334155">Agents that act, with your skills and knowledge</text>
  <rect x="496" y="312" width="110" height="22" rx="11" fill="#f2f6ff" stroke="#c2dafb"/><text x="551" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Agent Creator</text>
  <rect x="614" y="312" width="92" height="22" rx="11" fill="#f2f6ff" stroke="#c2dafb"/><text x="660" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">tools &amp; MCP</text>
  <rect x="714" y="312" width="98" height="22" rx="11" fill="#f2f6ff" stroke="#c2dafb"/><text x="763" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Knowledges</text>

  <!-- 3 Scale & transform -->
  <rect x="790" y="152" width="382" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="790" y="152" width="8" height="96" rx="4" fill="#4480ed"/>
  <text x="816" y="178" font-size="14.5" font-weight="700" fill="#2541a8">3 · Scale &amp; transform</text>
  <text x="1158" y="176" text-anchor="end" font-size="9.5" fill="#94A3B8">Gartner: Scaled</text>
  <text x="816" y="200" font-size="11" fill="#334155">Custom apps, mutualized infra, lower software costs</text>
  <rect x="816" y="214" width="68" height="22" rx="11" fill="#eef4ff" stroke="#c2dafb"/><text x="850" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Builder</text>
  <rect x="892" y="214" width="94" height="22" rx="11" fill="#eef4ff" stroke="#c2dafb"/><text x="939" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">Collections</text>
  <rect x="994" y="214" width="140" height="22" rx="11" fill="#eef4ff" stroke="#c2dafb"/><text x="1064" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#2541a8">connectors + MCP</text>

  <!-- cross-cutting band -->
  <rect x="140" y="498" width="1032" height="28" rx="8" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="656" y="516" text-anchor="middle" font-size="11" fill="#2541a8">At every stage: governance (central and delegated) · sovereignty as freedom of cloud and model · resilience</text>
</svg>
