<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#CBD5E1"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="460" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Gen.AI maturity model</text>
  <text x="600" y="79" text-anchor="middle" font-size="12.5" fill="#64748B">Meet you where you are, and grow with you. Value rises as you move from secure access, to specialized agents, to multi-agent systems.</text>

  <!-- axes -->
  <line x1="120" y1="430" x2="120" y2="118" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="120" y1="430" x2="1130" y2="430" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text transform="rotate(-90 78 275)" x="78" y="275" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">MATURITY</text>
  <text x="625" y="456" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">ROI · BUSINESS VALUE</text>
  <text x="150" y="456" text-anchor="middle" font-size="13" fill="#94A3B8">-</text>
  <text x="1110" y="456" text-anchor="middle" font-size="13" fill="#94A3B8">+</text>

  <!-- rising path -->
  <line x1="180" y1="404" x2="1085" y2="196" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>

  <!-- Deploy -->
  <rect x="150" y="332" width="310" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="332" width="8" height="80" rx="4" fill="#3B82F6"/>
  <text x="176" y="360" font-size="14" font-weight="700" fill="#1D4ED8">1 · Deploy</text>
  <text x="176" y="380" font-size="11.5" fill="#334155">Secure multi-LLM and multimodal access</text>
  <text x="176" y="398" font-size="10.5" fill="#64748B">Chat · Store</text>

  <!-- Transform -->
  <rect x="470" y="252" width="310" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="470" y="252" width="8" height="80" rx="4" fill="#6B47D9"/>
  <text x="496" y="280" font-size="14" font-weight="700" fill="#5B21B6">2 · Transform</text>
  <text x="496" y="300" font-size="11.5" fill="#334155">Specialized agents on your knowledge</text>
  <text x="496" y="318" font-size="10.5" fill="#64748B">Agent Creator · Knowledges · Insights</text>

  <!-- Innovate -->
  <rect x="790" y="172" width="310" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="790" y="172" width="8" height="80" rx="4" fill="#14B8A6"/>
  <text x="816" y="200" font-size="14" font-weight="700" fill="#0F766E">3 · Innovate</text>
  <text x="816" y="220" font-size="11.5" fill="#334155">Multi-agent systems on your data and IT</text>
  <text x="816" y="238" font-size="10.5" fill="#64748B">Builder · Collections · connectors &amp; MCP</text>

  <text x="150" y="150" font-size="11" fill="#94A3B8">Governed and measured at every stage: Governe + Insights</text>
</svg>
