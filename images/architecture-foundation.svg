<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <style>
      .h1{font-size:26px;font-weight:700;fill:#0F172A}
      .sub{font-size:14px;fill:#64748B}
      .kicker{font-size:12px;font-weight:700;letter-spacing:1.2px}
      .lead{font-size:12px;font-weight:700}
      .body{font-size:11.5px;fill:#334155}
      .card{font-size:12.5px;font-weight:600;fill:#0F172A}
      .prov{font-size:12px;fill:#334155}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="20" y="20" width="1160" height="740" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- header -->
  <text x="600" y="62" text-anchor="middle" class="h1">Prisme.ai: the AI Information System of tomorrow</text>
  <text x="600" y="90" text-anchor="middle" class="sub">One unified foundation where business and technical teams build, govern, and run AI, instead of another silo.</text>

  <!-- channels band -->
  <rect x="60" y="112" width="1080" height="70" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="82" y="140" class="kicker" fill="#2563EB">CONSUMED EVERYWHERE</text>
  <text x="82" y="160" class="body" fill="#3B82F6" font-weight="600">API-first · MCP · connectors</text>
  <text x="322" y="154" class="prov" fill="#1E3A8A" font-weight="600">Chat  ·  Store  ·  Website &amp; Portal  ·  Microsoft Teams  ·  Google Workspace  ·  WhatsApp  ·  Facebook</text>

  <!-- two doors -->
  <rect x="120" y="200" width="440" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="142" y="223" class="lead" fill="#2563EB" font-size="11.5" letter-spacing="0.6">BUSINESS TEAMS · NO-CODE</text>
  <text x="142" y="243" class="body">Store · Chat · Agent Creator</text>

  <rect x="640" y="200" width="440" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="662" y="223" class="lead" fill="#7C3AED" font-size="11.5" letter-spacing="0.6">TECHNICAL TEAMS · FULL-CODE</text>
  <text x="662" y="243" class="body">Builder · VS Code · Git (Infrastructure-as-Code)</text>

  <line x1="340" y1="256" x2="340" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="256" x2="860" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- core foundation -->
  <rect x="60" y="274" width="1080" height="300" rx="18" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="298" text-anchor="middle" class="kicker" fill="#1E293B">THE UNIFIED FOUNDATION</text>

  <!-- governance bar -->
  <rect x="80" y="310" width="1040" height="46" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="100" y="330" class="lead" fill="#4F46E5" font-size="12">GOVERNED BY DESIGN</text>
  <text x="100" y="347" class="body" fill="#4338CA">Central + per-org (inherited) · SSO · RBAC · audit logs · chargeback · per-agent service accounts</text>

  <!-- products row -->
  <g>
    <rect x="80"  y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="150"  y="404" text-anchor="middle" class="card">Chat</text>
    <rect x="230" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="300" y="404" text-anchor="middle" class="card">Agent Creator</text>
    <rect x="380" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="450" y="404" text-anchor="middle" class="card">Knowledges</text>
    <rect x="530" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="600" y="404" text-anchor="middle" class="card">Collections</text>
    <rect x="680" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="750" y="404" text-anchor="middle" class="card">Builder</text>
    <rect x="830" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="900" y="404" text-anchor="middle" class="card">Insights</text>
    <rect x="980" y="368" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1050" y="404" text-anchor="middle" class="card">Engage</text>
  </g>

  <!-- runtime band -->
  <rect x="80" y="446" width="1040" height="42" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="100" y="472" class="body" fill="#1D4ED8" font-weight="600">FULL-STACK AGENTIC RUNTIME · React front-ends + agentic workflows + agents</text>

  <!-- traceability bar -->
  <rect x="80" y="500" width="1040" height="46" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
  <text x="100" y="520" class="lead" fill="#0284C7" font-size="12">TRACEABLE NATIVELY</text>
  <text x="100" y="537" class="body" fill="#0369A1">Event-driven · normalized events (type, correlation ID, timestamp) · observability, security, measurable ROI</text>

  <!-- arrows to resilience -->
  <line x1="325" y1="574" x2="325" y2="600" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="875" y1="574" x2="875" y2="600" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- resilience base -->
  <rect x="60" y="602" width="530" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="632" class="card" font-size="14">LLM-agnostic</text>
  <text x="84" y="652" class="sub" font-size="11">Choose or route the best model per use case</text>
  <text x="84" y="690" class="prov">OpenAI · Anthropic · Mistral</text>
  <text x="84" y="712" class="prov">AWS Bedrock · Google Vertex AI · open-source (self-hosted)</text>

  <rect x="610" y="602" width="530" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="634" y="632" class="card" font-size="14">Cloud-agnostic</text>
  <text x="634" y="652" class="sub" font-size="11">Any major cloud or on-premises, no vendor lock-in</text>
  <text x="634" y="690" class="prov">AWS · Azure · Google Cloud · OVHcloud</text>
  <text x="634" y="712" class="prov">Outscale · OpenShift · on-premises</text>
</svg>
