<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <style>
      .h1{font-size:24px;font-weight:700;fill:#0F172A}
      .sub{font-size:13px;fill:#64748B}
      .side{font-size:12px;font-weight:700;letter-spacing:1px}
      .st{font-size:12px;font-weight:700;fill:#0F172A}
      .sn{font-size:9px;fill:#94A3B8}
      .lyr{font-size:13.5px;font-weight:700}
      .lys{font-size:11px}
    </style>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
  </defs>

  <rect x="20" y="20" width="1160" height="480" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="56" text-anchor="middle" class="h1">From AI silos to one unified foundation</text>
  <text x="600" y="82" text-anchor="middle" class="sub">Stop scattering a new ungoverned assistant for every use case. Build them all on one platform.</text>

  <!-- BEFORE -->
  <rect x="52" y="110" width="470" height="360" rx="16" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="76" y="140" class="side" fill="#DC2626">BEFORE</text>
  <text x="76" y="160" class="sub" fill="#B91C1C" font-size="12">AI scattered across silos</text>

  <!-- silo cards, tilted -->
  <g transform="translate(96,190) rotate(-6)">
    <rect width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#F97316"/>
    <text x="18" y="24" class="st">Chatbot A</text><text x="18" y="41" class="sn">own logs · own access</text>
  </g>
  <g transform="translate(300,178) rotate(5)">
    <rect width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#EC4899"/>
    <text x="18" y="24" class="st">Copilot B</text><text x="18" y="41" class="sn">no traceability</text>
  </g>
  <g transform="translate(180,262) rotate(-3)">
    <rect width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#6B47D9"/>
    <text x="18" y="24" class="st">RAG app C</text><text x="18" y="41" class="sn">its own stack</text>
  </g>
  <g transform="translate(360,278) rotate(8)">
    <rect width="140" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#14B8A6"/>
    <text x="18" y="24" class="st">Script bot D</text><text x="18" y="41" class="sn">no controls</text>
  </g>
  <g transform="translate(96,346) rotate(4)">
    <rect width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#4D7CFF"/>
    <text x="18" y="24" class="st">Assistant E</text><text x="18" y="41" class="sn">separate identity</text>
  </g>
  <g transform="translate(316,360) rotate(-5)">
    <rect width="150" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/><rect width="6" height="52" rx="3" fill="#64748B"/>
    <text x="18" y="24" class="st">Agent X</text><text x="18" y="41" class="sn">shadow IT</text>
  </g>

  <text x="287" y="452" text-anchor="middle" class="sn" font-size="11" fill="#B91C1C">No shared traceability, access, or governance</text>

  <!-- arrow -->
  <line x1="536" y1="290" x2="654" y2="290" stroke="#3B82F6" stroke-width="3" marker-end="url(#a2)"/>
  <text x="595" y="278" text-anchor="middle" class="side" fill="#2563EB" font-size="13">Prisme.ai</text>

  <!-- AFTER -->
  <rect x="678" y="110" width="470" height="360" rx="16" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="702" y="140" class="side" fill="#16A34A">AFTER</text>
  <text x="702" y="160" class="sub" fill="#15803D" font-size="12">One governed, unified foundation</text>

  <!-- experience chip -->
  <rect x="702" y="182" width="440" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="723" y="207" class="st" font-size="12.5">One secure, branded experience for every user</text>

  <!-- layer 1 -->
  <rect x="702" y="234" width="440" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="723" y="258" class="lyr" fill="#1D4ED8">Agents · apps · workflows</text>
  <text x="723" y="277" class="lys" fill="#3B82F6" font-size="10.5">Chat · Agent Creator · Builder · Knowledges · Collections · Insights · Engage</text>

  <!-- layer 2 -->
  <rect x="702" y="300" width="440" height="58" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="723" y="324" class="lyr" fill="#4F46E5">Governed by design + traceable natively</text>
  <text x="723" y="343" class="lys" fill="#4338CA">SSO · roles · audit · chargeback · event-driven, correlation ID</text>

  <!-- layer 3 -->
  <rect x="702" y="366" width="440" height="58" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="723" y="390" class="lyr" fill="#334155">Any LLM · any cloud</text>
  <text x="723" y="409" class="lys" fill="#475569" font-size="10.5">AWS · Azure · Google Cloud · OVHcloud · Outscale · on-premises</text>

  <text x="913" y="452" text-anchor="middle" class="sn" font-size="11" fill="#15803D">Shared traceability, access, and governance, by default</text>
</svg>
