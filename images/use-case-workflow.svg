<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <style>.k{font-size:11px;font-weight:700;letter-spacing:0.8px}.r{font-size:12px;fill:#334155}.s{font-size:10px;fill:#94A3B8}</style>
  </defs>
  <rect x="20" y="20" width="1160" height="380" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Agentic workflows: headless automation</text>
  <text x="600" y="76" text-anchor="middle" font-size="12.5" fill="#64748B">A process that runs on its own, calls agents where judgment is needed, and acts on your systems. No UI required.</text>

  <rect x="50" y="104" width="300" height="212" rx="14" fill="#eef4ff" stroke="#c2dafb"/>
  <text x="72" y="130" class="k" fill="#2541a8">TRIGGERS</text>
  <rect x="72" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="166" class="r">Endpoint (webhook / API)</text>
  <rect x="72" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="204" class="r">Event on the bus</text>
  <rect x="72" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="86" y="242" class="r">Schedule</text>
  <text x="72" y="286" class="s">no user interface</text>

  <line x1="356" y1="210" x2="434" y2="210" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="440" y="104" width="320" height="212" rx="14" fill="#f2f6ff" stroke="#4480ed" stroke-width="2"/>
  <text x="462" y="130" class="k" fill="#2541a8">THE WORKFLOW</text>
  <rect x="462" y="146" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="476" y="166" class="r">Steps, conditions, retries</text>
  <rect x="462" y="184" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="476" y="204" class="r">Calls agents where judgment helps</text>
  <rect x="462" y="222" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="476" y="242" class="r">Human approval on sensitive steps</text>
  <text x="462" y="286" class="s">versioned in Git, reproducible</text>

  <line x1="766" y1="210" x2="844" y2="210" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="850" y="104" width="300" height="212" rx="14" fill="#eef4ff" stroke="#c2dafb"/>
  <text x="872" y="130" class="k" fill="#2541a8">SYSTEMS &amp; OUTCOME</text>
  <rect x="872" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="166" class="r">Update CRM · ERP · ticketing</text>
  <rect x="872" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="204" class="r">Generate a report or record</text>
  <rect x="872" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#c2dafb"/><text x="886" y="242" class="r">Notify people or systems</text>
  <text x="872" y="286" class="s">audit-ready output</text>

  <rect x="50" y="330" width="1100" height="52" rx="12" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="600" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#233b85">Governed and traceable end to end</text>
  <text x="600" y="370" text-anchor="middle" font-size="11.5" fill="#2541a8">Every run followed by correlation ID; asynchronous and scalable by design.</text>
</svg>
