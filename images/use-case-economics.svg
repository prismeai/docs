<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#CBD5E1"/></marker>
    <marker id="rt" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#CBD5E1"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="420" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="50" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">The economics: it amortizes</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="#64748B">Classic delivery adds a full stack per use case, so cost scales linearly. On Prisme, the platform is shared, so each new use case is a fraction of the cost.</text>

  <!-- axes -->
  <line x1="120" y1="392" x2="120" y2="104" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="120" y1="392" x2="1140" y2="392" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#rt)"/>
  <text transform="rotate(-90 74 250)" x="74" y="250" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">TOTAL COST (TCO)</text>
  <text x="630" y="418" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#94A3B8">NUMBER OF USE CASES</text>

  <!-- classic: steep linear -->
  <line x1="140" y1="378" x2="1110" y2="150" stroke="#EF4444" stroke-width="2.5"/>
  <circle cx="140" cy="378" r="4" fill="#EF4444"/>
  <text x="980" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Classic delivery</text>
  <text x="980" y="196" text-anchor="middle" font-size="10.5" fill="#B91C1C">a dedicated app, CI/CD, Ops,</text>
  <text x="980" y="211" text-anchor="middle" font-size="10.5" fill="#B91C1C">SIEM, observability, access</text>
  <text x="980" y="226" text-anchor="middle" font-size="10.5" fill="#B91C1C">per use case</text>

  <!-- prisme: gentle slope -->
  <line x1="140" y1="300" x2="1110" y2="258" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="140" cy="300" r="4" fill="#3B82F6"/>
  <text x="900" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Prisme.ai</text>
  <text x="900" y="306" text-anchor="middle" font-size="10.5" fill="#2563EB">shared platform: add a use case, not a stack</text>

  <!-- upfront note for prisme -->
  <text x="150" y="292" font-size="9.5" fill="#94A3B8">platform</text>

  <!-- break-even -->
  <line x1="547" y1="392" x2="547" y2="282" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="547" cy="282" r="4" fill="#0F172A"/>
  <text x="547" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">break-even</text>

  <text x="600" y="440" text-anchor="middle" font-size="0" fill="#fff"> </text>
</svg>
