<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <style>.k{font-size:11px;font-weight:700;letter-spacing:0.8px}.r{font-size:12px;fill:#334155}.s{font-size:10px;fill:#94A3B8}</style>
  </defs>
  <rect x="20" y="20" width="1160" height="380" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Agents: talk to it, it acts</text>
  <text x="600" y="76" text-anchor="middle" font-size="12.5" fill="#64748B">A conversational agent that reasons over your knowledge, calls tools, and acts on your systems, all governed.</text>

  <rect x="50" y="104" width="300" height="212" rx="14" fill="#EFF6FF" stroke="#BFD3FF"/>
  <text x="72" y="130" class="k" fill="#1D4ED8">WHERE PEOPLE ASK</text>
  <rect x="72" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#BFD3FF"/><text x="86" y="166" class="r">Chat &amp; Store</text>
  <rect x="72" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#BFD3FF"/><text x="86" y="204" class="r">Microsoft Teams · WhatsApp</text>
  <rect x="72" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#BFD3FF"/><text x="86" y="242" class="r">Website embed</text>
  <text x="72" y="286" class="s">no login needed for public agents</text>

  <line x1="356" y1="210" x2="434" y2="210" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="440" y="104" width="320" height="212" rx="14" fill="#F5F3FF" stroke="#6B47D9" stroke-width="2"/>
  <text x="462" y="130" class="k" fill="#5B21B6">THE AGENT</text>
  <rect x="462" y="146" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="476" y="166" class="r">LLM, routed across providers</text>
  <rect x="462" y="184" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="476" y="204" class="r">Skills: tools &amp; MCP</text>
  <rect x="462" y="222" width="276" height="30" rx="8" fill="#FFF7ED" stroke="#FED7AA"/><text x="476" y="242" class="r" fill="#9A3412">Knowledge (RAG) &amp; memory</text>
  <text x="462" y="286" class="s">answers sourced to your content</text>

  <line x1="766" y1="210" x2="844" y2="210" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="850" y="104" width="300" height="212" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="872" y="130" class="k" fill="#EA580C">YOUR SYSTEMS</text>
  <rect x="872" y="146" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#FED7AA"/><text x="886" y="166" class="r">CRM · ITSM · ERP</text>
  <rect x="872" y="184" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#FED7AA"/><text x="886" y="204" class="r">Documents &amp; databases</text>
  <rect x="872" y="222" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#FED7AA"/><text x="886" y="242" class="r">APIs (read &amp; write)</text>
  <text x="872" y="286" class="s">via connectors &amp; MCP</text>

  <rect x="50" y="330" width="1100" height="52" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="600" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#3730A3">Governed and traceable</text>
  <text x="600" y="370" text-anchor="middle" font-size="11.5" fill="#4338CA">Every answer sourced, every action logged by correlation ID, human approval on sensitive actions.</text>
</svg>
