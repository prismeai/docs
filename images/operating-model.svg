<text x="510" y="146" font-size="11" fill="#334155">Validate compliance</text>
<text x="510" y="172" font-size="11" fill="#334155">Approve guardrails</text>
<text x="510" y="198" font-size="11" fill="#334155">Grant sharing rights</text>
