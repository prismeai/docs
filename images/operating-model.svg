<text x="966" y="112" font-size="10.5" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">EVERYONE</text>
<text x="966" y="146" font-size="11" fill="#334155">Use agents</text>
<text x="966" y="172" font-size="11" fill="#334155">Create for self</text>
<text x="966" y="198" font-size="11" fill="#334155">No share by default</text>
<text x="600" y="268" text-anchor="middle" font-size="11" fill="#94A3B8">By default, users create agents for themselves only. Committees and the platform team grant sharing, publishing, and guardrails.</text>
