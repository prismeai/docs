<text x="54" y="146" font-size="11" fill="#334155">Run &amp; releases</text>
<text x="54" y="172" font-size="11" fill="#334155">Platform guardrails</text>
<text x="54" y="198" font-size="11" fill="#334155">Forced hooks (data class.)</text>
<rect x="268" y="92" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
