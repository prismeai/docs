<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="460" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Two independent cycles: the platform, and each use case</text>
  <text x="600" y="76" text-anchor="middle" font-size="12" fill="#64748B">Platform versions flow Dev to Preprod to Prod. A use case lives on the Prod environment, versioned by its own Git.</text>

  <!-- platform environments band -->
  <text x="120" y="106" font-size="11" font-weight="700" letter-spacing="0.8" fill="#4480ed">PLATFORM ENVIRONMENTS (self-hosted) · CI/CD · Platform Squad</text>
  <rect x="120" y="116" width="220" height="58" rx="10" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="134" y="140" font-size="12.5" font-weight="700" fill="#2541a8">Development</text>
  <text x="134" y="159" font-size="10.5" fill="#255be0">new versions first</text>
  <rect x="430" y="116" width="220" height="58" rx="10" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="444" y="140" font-size="12.5" font-weight="700" fill="#2541a8">Pre-production</text>
  <text x="444" y="159" font-size="10.5" fill="#255be0">non-regression tests</text>
  <rect x="740" y="116" width="220" height="58" rx="10" fill="#dbe7ff" stroke="#98c3f8"/>
  <text x="754" y="140" font-size="12.5" font-weight="700" fill="#233b85">Production</text>
  <text x="754" y="159" font-size="10.5" fill="#2541a8">validated only</text>
  <line x1="346" y1="145" x2="424" y2="145" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="385" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">go / no-go</text>
  <line x1="656" y1="145" x2="734" y2="145" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="695" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">go / no-go</text>

  <!-- prod env expands into the big box -->
  <line x1="850" y1="174" x2="850" y2="230" stroke="#98c3f8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- production platform environment box hosting the use case -->
  <rect x="120" y="232" width="960" height="196" rx="14" fill="#F8FAFC" stroke="#233b85" stroke-width="1.6"/>
  <text x="140" y="258" font-size="11" font-weight="700" letter-spacing="0.8" fill="#233b85">PRODUCTION PLATFORM ENVIRONMENT · a use case runs here</text>

  <rect x="160" y="286" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#255be0" stroke-width="1.6"/>
  <text x="176" y="312" font-size="13" font-weight="700" fill="#2541a8">Dev workspace</text>
  <text x="176" y="333" font-size="11" fill="#334155">build &amp; iterate</text>
  <text x="176" y="353" font-size="11" fill="#64748B">Git: read / write</text>

  <rect x="475" y="311" width="250" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="600" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Use-case Git repo</text>

  <rect x="790" y="286" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#4480ed" stroke-width="1.6"/>
  <text x="806" y="312" font-size="13" font-weight="700" fill="#2541a8">Prod workspace</text>
  <text x="806" y="333" font-size="11" fill="#334155">validated release</text>
  <text x="806" y="353" font-size="11" fill="#64748B">Git: read-only</text>

  <line x1="410" y1="336" x2="473" y2="336" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="441" y="327" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">push</text>
  <line x1="725" y1="336" x2="788" y2="336" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="756" y="327" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">read-only</text>
  <text x="600" y="406" text-anchor="middle" font-size="10.5" fill="#94A3B8">Promotion via CD pipeline or Builder UI. No manual change in production.</text>

  <text x="600" y="456" text-anchor="middle" font-size="11" fill="#64748B">The use case lifecycle is decoupled from platform upgrades. Critical use cases are also validated across Dev / Preprod / Prod during a platform upgrade (Platform Squad).</text>
</svg>
