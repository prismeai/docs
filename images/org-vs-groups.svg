<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
<rect x="20" y="20" width="1160" height="380" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">One organization or several? And where do groups fit?</text>
<rect x="60" y="90" width="520" height="240" rx="14" fill="#eef4ff" stroke="#255be0" stroke-width="1.6"/>
<text x="84" y="124" font-size="15" font-weight="700" fill="#2541a8">One org + groups</text>
<text x="84" y="146" font-size="11.5" fill="#64748B">Shared foundation, lighter administration</text>
<circle cx="90" cy="174" r="3" fill="#2541a8"/>
<text x="104" y="178" font-size="12" fill="#334155">Shared catalog and asset reuse across teams</text>
<circle cx="90" cy="204" r="3" fill="#2541a8"/>
<text x="104" y="208" font-size="12" fill="#334155">Groups organize members and permissions</text>
<circle cx="90" cy="234" r="3" fill="#2541a8"/>
<text x="104" y="238" font-size="12" fill="#334155">Membership rules auto-assign roles</text>
<circle cx="90" cy="264" r="3" fill="#2541a8"/>
<text x="104" y="268" font-size="12" fill="#334155">Best when teams collaborate and share</text>
<rect x="620" y="90" width="520" height="240" rx="14" fill="#eef4ff" stroke="#4480ed" stroke-width="1.6"/>
<text x="644" y="124" font-size="15" font-weight="700" fill="#2541a8">Multiple organizations</text>
<text x="644" y="146" font-size="11.5" fill="#64748B">Hard isolation, heavier administration</text>
<circle cx="650" cy="174" r="3" fill="#2541a8"/>
<text x="664" y="178" font-size="12" fill="#334155">Separate data, quotas, billing, and models</text>
<circle cx="650" cy="204" r="3" fill="#2541a8"/>
<text x="664" y="208" font-size="12" fill="#334155">Per-subsidiary or per-BU compliance</text>
<circle cx="650" cy="234" r="3" fill="#2541a8"/>
<text x="664" y="238" font-size="12" fill="#334155">Independent catalogs, no cross-sharing</text>
<circle cx="650" cy="264" r="3" fill="#2541a8"/>
<text x="664" y="268" font-size="12" fill="#334155">Best when strict separation is required</text>
<rect x="60" y="346" width="1080" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="600" y="371" text-anchor="middle" font-size="12" fill="#0F172A">Choose multiple orgs only for hard separation of data, billing, or compliance. Otherwise one org with groups keeps reuse and admin simple.</text>
</svg>
