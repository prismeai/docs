<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Satoshi','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <style>
      .h1{font-size:25px;font-weight:700;fill:#0F172A}
      .sub{font-size:13.5px;fill:#64748B}
      .kick{font-size:11px;font-weight:700;letter-spacing:1px;fill:#FFFFFF}
      .kd{font-size:11px;font-weight:700;letter-spacing:1px}
      .chip{font-size:12px;font-weight:600}
      .note{font-size:10.5px;fill:#64748B}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
  </defs>

  <rect x="20" y="20" width="1160" height="480" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="56" text-anchor="middle" class="h1">The building blocks of one foundation</text>
  <text x="600" y="82" text-anchor="middle" class="sub">Not separate tools you stitch together. Facets of the same governed, traceable platform.</text>

  <!-- data layer -->
  <rect x="60" y="104" width="1080" height="60" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="82" y="130" class="kd" fill="#EA580C">KNOWLEDGE &amp; DATA</text>
  <text x="82" y="148" class="note" fill="#9A3412" font-size="10.5">what grounds your agents</text>
  <text x="360" y="140" class="chip" fill="#7C2D12">Knowledges · unstructured (RAG)</text>
  <text x="720" y="140" class="chip" fill="#7C2D12">Collections · structured (tables)</text>
  <line x1="185" y1="164" x2="185" y2="196" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- stage cards -->
  <!-- CREATE -->
  <rect x="60" y="200" width="252" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="60" y="200" width="252" height="30" rx="12" fill="#6B47D9"/>
  <rect x="60" y="214" width="252" height="16" fill="#6B47D9"/>
  <text x="74" y="220" class="kick">CREATE</text>
  <rect x="74" y="242" width="224" height="32" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="84" y="262" class="chip" fill="#5B21B6">Agent Creator · no-code</text>
  <rect x="74" y="282" width="224" height="32" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="84" y="302" class="chip" fill="#5B21B6">Builder · full-code</text>
  <text x="74" y="334" class="note">agents · workflows · React front-ends</text>

  <!-- CONSUME -->
  <rect x="336" y="200" width="252" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="336" y="200" width="252" height="30" rx="12" fill="#4D7CFF"/>
  <rect x="336" y="214" width="252" height="16" fill="#4D7CFF"/>
  <text x="350" y="220" class="kick">CONSUME</text>
  <rect x="350" y="242" width="224" height="32" rx="8" fill="#EFF4FF" stroke="#BFD3FF"/>
  <text x="360" y="262" class="chip" fill="#1E40AF">Chat · where agents live</text>
  <rect x="350" y="282" width="224" height="32" rx="8" fill="#EFF4FF" stroke="#BFD3FF"/>
  <text x="360" y="302" class="chip" fill="#1E40AF">Store · discover agents</text>
  <text x="350" y="334" class="note">+ connectors: Teams · WhatsApp · web</text>

  <!-- MEASURE -->
  <rect x="612" y="200" width="252" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="612" y="200" width="252" height="30" rx="12" fill="#EC4899"/>
  <rect x="612" y="214" width="252" height="16" fill="#EC4899"/>
  <text x="626" y="220" class="kick">MEASURE</text>
  <rect x="626" y="242" width="224" height="32" rx="8" fill="#FDF2F8" stroke="#FBCFE8"/>
  <text x="636" y="262" class="chip" fill="#9D174D">Insights</text>
  <text x="626" y="292" class="note">quality · adoption · cost</text>
  <text x="626" y="312" class="note">GDPR &amp; compliance oversight</text>

  <!-- ENGAGE -->
  <rect x="888" y="200" width="252" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="888" y="200" width="252" height="30" rx="12" fill="#14B8A6"/>
  <rect x="888" y="214" width="252" height="16" fill="#14B8A6"/>
  <text x="902" y="220" class="kick">ENGAGE</text>
  <rect x="902" y="242" width="224" height="32" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="912" y="262" class="chip" fill="#0F766E">Engage</text>
  <text x="902" y="292" class="note">announcements · notifications</text>
  <text x="902" y="312" class="note">drive real adoption</text>

  <!-- forward arrows -->
  <line x1="312" y1="266" x2="336" y2="266" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="588" y1="266" x2="612" y2="266" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="864" y1="266" x2="888" y2="266" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- adoption loop: engage back to consume -->
  <path d="M1014,350 L1014,378 L462,378 L462,350" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="738" y="373" text-anchor="middle" class="note" fill="#0F766E" font-weight="600">drives adoption, back into the loop</text>

  <!-- governe -->
  <rect x="60" y="398" width="1080" height="58" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="82" y="423" class="kd" fill="#4F46E5">GOVERNE</text>
  <text x="82" y="441" class="note" fill="#4338CA" font-size="11">SSO · roles &amp; permissions · model access · audit logs · chargeback, across every block, central + per-org</text>
  <text x="1120" y="432" text-anchor="end" class="note" fill="#6366F1" font-weight="700">applies to all</text>

  <text x="600" y="484" text-anchor="middle" class="note" font-size="11">One foundation · any LLM · any cloud · API-first</text>
</svg>
