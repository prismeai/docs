<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'PP Telegraf','Inter',system-ui,-apple-system,sans-serif"><style>line[marker-end],path[marker-end]{stroke-dasharray:6 6;animation:pflow 1.5s linear infinite}@keyframes pflow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){line[marker-end],path[marker-end]{animation:none}}</style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <style>
      .kick{font-size:11px;font-weight:700;letter-spacing:1px}
      .pill{font-size:11px;fill:#334155}
      .mono{font-family:'SFMono-Regular',ui-monospace,Menlo,monospace;font-size:11px}
      .cap{font-size:10px;fill:#94A3B8}
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="460" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">An App is an SDK: import it, and your automations inherit its instructions</text>
  <text x="600" y="80" text-anchor="middle" font-size="12.5" fill="#64748B">Publish any workspace as a versioned App. Import that App into another workspace, and its instructions become available inside your automations.</text>

  <!-- COL 1: a workspace -->
  <text x="66" y="112" class="kick" fill="#255be0">A WORKSPACE (FULL-STACK)</text>
  <rect x="50" y="122" width="350" height="256" rx="14" fill="#F8FAFC" stroke="#255be0" stroke-width="1.6"/>
  <g>
    <rect x="66" y="140" width="318" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="84" cy="155" r="5" fill="#255be0"/><text x="100" y="159" class="pill">Pages · React UI</text>
    <rect x="66" y="178" width="318" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="84" cy="193" r="5" fill="#4480ed"/><text x="100" y="197" class="pill">Automations · agentic flows</text>
    <rect x="66" y="216" width="318" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="84" cy="231" r="5" fill="#4480ed"/><text x="100" y="235" class="pill">Imports · apps (pinned)</text>
    <rect x="66" y="254" width="318" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="84" cy="269" r="5" fill="#4480ed"/><text x="100" y="273" class="pill">Files · PDF &amp; assets</text>
    <rect x="66" y="292" width="318" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="84" cy="307" r="5" fill="#6aa0f5"/><text x="100" y="311" class="pill">Events · execution</text>
  </g>
  <text x="66" y="350" class="cap">Products (Agent Creator, Knowledges...) are workspaces like this.</text>

  <!-- publish arrow -->
  <line x1="404" y1="250" x2="446" y2="250" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="425" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">publish</text>

  <!-- COL 2: app store -->
  <text x="466" y="112" class="kick" fill="#2541a8">APP STORE (SDKs)</text>
  <rect x="450" y="122" width="300" height="256" rx="14" fill="#eef4ff" stroke="#c2dafb"/>
  <g>
    <rect x="466" y="140" width="268" height="42" rx="9" fill="#FFFFFF" stroke="#4480ed" stroke-width="1.8"/>
    <text x="480" y="158" font-size="12" font-weight="700" fill="#2541a8">Agent Factory App</text>
    <rect x="668" y="147" width="52" height="18" rx="9" fill="#f2f6ff" stroke="#c2dafb"/><text x="694" y="160" text-anchor="middle" font-size="9.5" fill="#4480ed">v3.1</text>
    <text x="480" y="174" class="cap">run an agent from an automation</text>

    <rect x="466" y="192" width="268" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><text x="480" y="213" font-size="12" font-weight="600" fill="#0F172A">Crawler App</text>
    <rect x="466" y="234" width="268" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><text x="480" y="255" font-size="12" font-weight="600" fill="#0F172A">Functions App</text>
    <rect x="466" y="276" width="268" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/><text x="480" y="297" font-size="12" font-weight="600" fill="#0F172A">Salesforce App</text>
  </g>
  <text x="466" y="332" class="cap">A published workspace, pinned to a version.</text>
  <text x="466" y="348" class="cap">Each exposes reusable instructions.</text>

  <!-- import arrow -->
  <line x1="754" y1="250" x2="796" y2="250" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="775" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">import</text>

  <!-- COL 3: your automation -->
  <text x="816" y="112" class="kick" fill="#4480ed">YOUR AUTOMATION</text>
  <rect x="800" y="122" width="350" height="256" rx="14" fill="#FCFCFD" stroke="#4480ed" stroke-width="1.6"/>
  <text x="818" y="152" class="mono" fill="#94A3B8">- fetch</text>
  <text x="818" y="176" class="mono" fill="#94A3B8">- set</text>
  <text x="818" y="200" class="mono" fill="#94A3B8">- conditions</text>
  <text x="818" y="226" class="mono" fill="#4480ed" font-weight="700">- run agent      &#8592; Agent Factory App</text>
  <text x="818" y="250" class="mono" fill="#2541a8" font-weight="700">- crawl url        &#8592; Crawler App</text>
  <rect x="812" y="300" width="326" height="62" rx="10" fill="#f2f6ff" stroke="#c2dafb"/>
  <text x="828" y="324" font-size="11.5" font-weight="700" fill="#255be0">Imported Apps add their instructions</text>
  <text x="828" y="342" font-size="11" fill="#2541a8">to your automations, called like native ones.</text>

  <!-- bottom distinction -->
  <rect x="50" y="398" width="1100" height="62" rx="12" fill="#eef4ff" stroke="#98c3f8"/>
  <text x="600" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#233b85">Agent Creator = the full-stack product workspace you use.  Agent Factory App = the SDK you import.</text>
  <text x="600" y="446" text-anchor="middle" font-size="11.5" fill="#2541a8">Same family, different roles. An App is just a workspace, published and version-pinned. It is workspaces all the way down.</text>
</svg>
